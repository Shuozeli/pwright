      - name: Verify handle-evaluation-only dependency boundary
        run: bash scripts/check-v2-handle-evaluation-dependencies.sh
      - name: Verify input-only dependency boundary
        run: bash scripts/check-v2-input-dependencies.sh
      - name: Verify optional Keyboard contract boundaries and generated outputs
        run: node scripts/check-v2-keyboard-contracts.mjs
      - name: Verify optional native Keyboard backend boundary
        run: node scripts/check-v2-keyboard-backend.mjs
      - name: Verify optional Keyboard wire composition boundary
        run: node scripts/check-v2-keyboard-composition.mjs
      - name: Verify optional Keyboard controlled runtime adapter
        run: CARGO_INCREMENTAL=0 cargo test --release --locked -p pwright-composition-chromium-keyboard --features runtime --lib
      - name: Verify optional Mouse contracts and generation
        run: node scripts/check-v2-mouse-contracts.mjs
      - name: Verify optional native Mouse backend boundary
        run: node scripts/check-v2-mouse-backend.mjs
      - name: Verify optional Mouse Page route boundary
        run: node scripts/check-v2-mouse-composition.mjs
      - name: Verify optional Mouse receipt-aware runtime adapter
        run: CARGO_INCREMENTAL=0 cargo test --release --locked -p pwright-composition-chromium-mouse --features runtime --lib
      - name: Verify Locator-only dependency boundary
        run: bash scripts/check-v2-locator-dependencies.sh
      - name: Verify Locator-composition dependency boundary
        run: bash scripts/check-v2-locator-composition-dependencies.sh
      - name: Verify Locator-resolution dependency boundaries
        run: bash scripts/check-v2-locator-resolution-dependencies.sh
      - name: Verify opt-in retained-reference group ownership
        run: |
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo test --release --locked -p pwright-backend-cdp-locator-resolution -p pwright-composition-chromium-locator-resolution --features retained-reference --lib
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo clippy --release --locked -p pwright-backend-cdp-locator-resolution -p pwright-composition-chromium-locator-resolution --features retained-reference --all-targets -- -D warnings
      - name: Verify opt-in retained upload host and source identity
        run: |
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo test --release --locked -p pwright-composition-chromium-handle-evaluation --features retained-reference --test retained_reference
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo clippy --release --locked -p pwright-composition-chromium-handle-evaluation --features retained-reference --all-targets -- -D warnings
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo test --release --locked -p pwright-node-host --features retained-file-input --lib
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo test --release --locked -p pwright-node-host --all-features --lib retained_uploads_add_eight
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo clippy --release --locked -p pwright-node-host --features retained-file-input --all-targets -- -D warnings
      - name: Verify opt-in Rust host persistent marker ownership
        run: |
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo test --release --locked -p pwright-node-host --features retained-target-marking --lib
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo test --release --locked -p pwright-node-host --features retained-target-marking,concurrent-close,extra-headers,drag-runtime,frame-navigation --lib
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo clippy --release --locked -p pwright-node-host --features retained-target-marking --all-targets -- -D warnings
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo clippy --release --locked -p pwright-node-host --features retained-target-marking,concurrent-close,extra-headers,drag-runtime,frame-navigation --all-targets -- -D warnings
      - name: Verify selected Node retained-upload preparation boundary
        run: |
          # Explicit --lib includes addon unit tests despite its library test=false setting.
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo test --release --locked -p pwright-node-addon --lib --features retained-file-input
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo test --release --locked -p pwright-node-addon --lib --features retained-file-input,concurrent-close,extra-headers,drag-runtime,frame-navigation
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo clippy --release --locked -p pwright-node-addon --features retained-file-input --all-targets -- -D warnings
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo clippy --release --locked -p pwright-node-addon --features retained-file-input,concurrent-close,extra-headers,drag-runtime,frame-navigation --all-targets -- -D warnings
      - name: Verify terminal retained-payload profiles
        run: |
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo test --release --locked -p pwright-node-host --features retained-serialized-payload-mutation --lib
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo test --release --locked -p pwright-node-host --features retained-serialized-payload-mutation,concurrent-close,extra-headers,drag-runtime,frame-navigation --lib
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo test --release --locked -p pwright-node-addon --lib --features retained-serialized-payload-mutation
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo test --release --locked -p pwright-node-addon --lib --features retained-serialized-payload-mutation,concurrent-close,extra-headers,drag-runtime,frame-navigation
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo clippy --release --locked -p pwright-node-addon --all-targets --features retained-serialized-payload-mutation -- -D warnings
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo clippy --release --locked -p pwright-node-addon --all-targets --features retained-serialized-payload-mutation,concurrent-close,extra-headers,drag-runtime,frame-navigation -- -D warnings
      - name: Verify Locator element-evaluation dependency boundary
        run: bash scripts/check-v2-locator-evaluation-dependencies.sh
      - name: Verify page-events-only dependency boundary
        run: bash scripts/check-v2-page-events-dependencies.sh
      - name: Verify page-events composition dependency boundary
        run: bash scripts/check-v2-page-events-composition-dependencies.sh
      - name: Verify network-events-only dependency boundary
        run: bash scripts/check-v2-network-events-dependencies.sh
      - name: Verify network-events composition dependency boundary
        run: bash scripts/check-v2-network-events-composition-dependencies.sh
      - name: Verify evaluation-only dependency boundary
        run: bash scripts/check-v2-evaluation-dependencies.sh
      - name: Verify content-only dependency boundary
        run: bash scripts/check-v2-content-dependencies.sh
      - name: Verify Locator-screenshot dependency boundary
        run: bash scripts/check-v2-locator-screenshot-dependencies.sh
      - name: Verify DOM-content-only dependency boundary
        run: bash scripts/check-v2-dom-content-dependencies.sh
      - name: Verify v2 umbrella feature boundaries
        run: bash scripts/check-v2-umbrella-dependencies.sh

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
      - uses: Swatinem/rust-cache@v2
      - run: CARGO_INCREMENTAL=0 cargo test --release --locked --workspace
      - name: Verify default Node addon unit tests
        run: CARGO_INCREMENTAL=0 cargo test --release --locked -p pwright-node-addon --lib

  node-package:
    name: Node package (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: packages/pwright/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
        if: matrix.node-version == '20'
        with:
          version: "0.12.5"
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.node-version == '20'
      - name: Install package dependencies
        working-directory: packages/pwright
        run: pnpm install --frozen-lockfile
      - uses: actions/checkout@v4
        if: matrix.node-version == '20'
        with:
          repository: microsoft/playwright
          ref: 961381ec73a9fa2661d92504eab1a6bd6eaffc75
          path: .work/core455-upstream
          persist-credentials: false
      - name: Verify pinned Core455 source-only bootstrap and guard syntax
        if: matrix.node-version == '20'
        run: |
          upstream="$GITHUB_WORKSPACE/.work/core455-upstream"
          test "$(git -C "$upstream" rev-parse HEAD)" = "961381ec73a9fa2661d92504eab1a6bd6eaffc75"
          node --check scripts/bootstrap_playwright_core455_source_only.cjs
          node --test scripts/test_bootstrap_playwright_core455_source_only.cjs
          node --check tests/official/playwright-core-internal-source-only-guard.cjs
          node -e 'const { suites } = require("./tests/official/playwright-core-internal-source-only-manifest.json"); if (!Array.isArray(suites) || suites.length !== 4) process.exit(1)'
      - name: Verify full pinned Core source inventory without executing tests
        if: matrix.node-version == '20'
        run: |
          uv run --no-project python -m unittest \
            scripts.test_verify_playwright_core_full_source_inventory -v
          uv run --no-project python \
            scripts/verify_playwright_core_full_source_inventory.py \
            "$GITHUB_WORKSPACE/.work/core455-upstream"
      - name: Install pinned offline oracle dependencies
        if: matrix.node-version == '20'
        working-directory: tests
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile
      - name: Verify package unit and type contracts
        working-directory: packages/pwright
        run: |
          pnpm test
          pnpm run test:server-connect-ws-error-adapter
          pnpm run test:server-connect-close-error-adapter
          pnpm run test:server-connect-headers-adapter
          pnpm test:types
      - name: Verify native dependency boundaries
        if: matrix.node-version == '20'
        working-directory: packages/pwright
        run: |
          pnpm test:boundary
      - name: Verify opt-in persistent-context preflight profile
        if: matrix.node-version == '20'
        working-directory: packages/pwright
        run: |
          CARGO_INCREMENTAL=0 cargo test --release --locked -p pwright-persistent-context-preflight
          CARGO_INCREMENTAL=0 cargo clippy --release --locked \
            -p pwright-persistent-context-preflight --all-targets -- -D warnings
          PWRIGHT_NATIVE_PROFILE=persistent-context-preflight CARGO_INCREMENTAL=0 pnpm build
          PWRIGHT_NATIVE_PROFILE=persistent-context-preflight pnpm test:native-load
          PWRIGHT_NATIVE_PROFILE=persistent-context-preflight pnpm test:persistent-context-preflight
          PWRIGHT_NATIVE_PROFILE=persistent-context-preflight pnpm test:persistent-context-preflight-native
      - name: Verify optional selector-registration profile
        if: matrix.node-version == '20'
        working-directory: packages/pwright
        run: |
          bash ../../scripts/check-node-selector-registration-dependencies.sh
          CARGO_INCREMENTAL=0 cargo test --release --locked \
            -p pwright-node-host --no-default-features \
            --features selector-registration --lib selector_registry::tests
          CARGO_INCREMENTAL=0 cargo clippy --release --locked \
            -p pwright-node-addon --no-default-features \
            --features selector-registration --all-targets --no-deps \
            -- -D warnings
          PWRIGHT_NATIVE_PROFILE=selector-registration CARGO_INCREMENTAL=0 pnpm build
          PWRIGHT_NATIVE_PROFILE=selector-registration pnpm test:native-load
      - name: Verify optional BrowserContext cookie profile
        if: matrix.node-version == '20'
        working-directory: packages/pwright
        run: |
          bash ../../scripts/check-node-context-cookies-dependencies.sh
          CARGO_INCREMENTAL=0 cargo clippy --release --locked \
            -p pwright-node-addon --no-default-features \
            --features context-cookies --all-targets --no-deps \
            -- -D warnings
          PWRIGHT_NATIVE_PROFILE=context-cookies CARGO_INCREMENTAL=0 pnpm build
          PWRIGHT_NATIVE_PROFILE=context-cookies pnpm test:native-load
          node --test test/context-cookies-adapter.test.mjs
      - name: Verify bounded large Route POST profile
        if: matrix.node-version == '20'
        working-directory: packages/pwright
        run: |
          bash ../../scripts/check-node-route-large-post-data-dependencies.sh
          CARGO_INCREMENTAL=0 cargo clippy --release --locked \
            -p pwright-node-addon --no-default-features \
            --features frame-navigation,large-evaluation-inputs,large-route-post-data \
            --all-targets --no-deps -- -D warnings
          PWRIGHT_NATIVE_PROFILE=route-large-post-data CARGO_INCREMENTAL=0 pnpm build
          PWRIGHT_NATIVE_PROFILE=route-large-post-data pnpm test:native-load
      - name: Verify optional HTTP-proxy profile
        if: matrix.node-version == '20'
        working-directory: packages/pwright
        run: |
          bash ../../scripts/check-node-api-request-http-proxy-dependencies.sh
          CARGO_INCREMENTAL=0 cargo clippy --release --locked \
            -p pwright-api-request-connector-http-proxy --all-targets -- -D warnings
          CARGO_INCREMENTAL=0 cargo clippy --release --locked \
            -p pwright-node-addon --no-default-features \
            --features api-request-http-proxy --all-targets --no-deps \
            -- -D warnings
          PWRIGHT_NATIVE_PROFILE=api-request-http-proxy CARGO_INCREMENTAL=0 pnpm build
          PWRIGHT_NATIVE_PROFILE=api-request-http-proxy pnpm test:native-load
      - name: Verify optional SOCKS5-proxy profile
        if: matrix.node-version == '20'
        working-directory: packages/pwright
        run: |
          bash ../../scripts/check-node-api-request-socks5-proxy-dependencies.sh
          CARGO_INCREMENTAL=0 cargo clippy --release --locked \
            -p pwright-api-request-connector-socks5 --all-targets -- -D warnings
          CARGO_INCREMENTAL=0 cargo clippy --release --locked \
            -p pwright-node-addon --no-default-features \
            --features api-request-socks5-proxy --all-targets --no-deps \
            -- -D warnings
          PWRIGHT_NATIVE_PROFILE=api-request-socks5-proxy CARGO_INCREMENTAL=0 pnpm build
          PWRIGHT_NATIVE_PROFILE=api-request-socks5-proxy pnpm test:native-load
      - name: Verify composable proxy-bypass profiles
        if: matrix.node-version == '20'
        working-directory: packages/pwright
        run: |
          bash ../../scripts/check-node-api-request-proxy-bypass-dependencies.sh
          CARGO_INCREMENTAL=0 cargo clippy --release --locked \
            -p pwright-api-request-connector-proxy-bypass --all-targets -- -D warnings
          CARGO_INCREMENTAL=0 cargo clippy --release --locked \
            -p pwright-node-addon --no-default-features \
            --features api-request-http-proxy,api-request-socks5-proxy,api-request-proxy-bypass \
            --all-targets --no-deps -- -D warnings
          PWRIGHT_NATIVE_PROFILE=api-request-http-proxy-bypass \
            CARGO_INCREMENTAL=0 pnpm build
          PWRIGHT_NATIVE_PROFILE=api-request-http-proxy-bypass \
            pnpm test:native-load
          PWRIGHT_NATIVE_PROFILE=api-request-socks5-proxy-bypass \
            CARGO_INCREMENTAL=0 pnpm build
          PWRIGHT_NATIVE_PROFILE=api-request-socks5-proxy-bypass \
            pnpm test:native-load
      - name: Verify BrowserContext API-request proxy composition
        if: matrix.node-version == '20'
        working-directory: packages/pwright
        run: |
          bash ../../scripts/check-node-context-api-request-proxy-dependencies.sh
          CARGO_INCREMENTAL=0 cargo clippy --release --locked \
            -p pwright-node-host --no-default-features \
            --features context-api-request,context-proxy --all-targets \
            -- -D warnings
          CARGO_INCREMENTAL=0 cargo clippy --release --locked \
            -p pwright-node-addon --no-default-features \
            --features context-api-request,context-proxy,api-request-http-proxy,api-request-socks5-proxy,api-request-proxy-bypass \
            --all-targets --no-deps -- -D warnings
          PWRIGHT_NATIVE_PROFILE=context-api-request-proxy \
            CARGO_INCREMENTAL=0 pnpm build
          PWRIGHT_NATIVE_PROFILE=context-api-request-proxy \
            pnpm test:native-load
      - name: Verify composable proxy TLS profiles
        if: matrix.node-version == '20'
        working-directory: packages/pwright
        run: |
          bash ../../scripts/check-node-api-request-proxy-tls-composition-dependencies.sh
          CARGO_INCREMENTAL=0 cargo clippy --release --locked \
            -p pwright-api-request-transport \
            -p pwright-api-request-connector-rustls \
            -p pwright-api-request-connector-http-proxy \
            -p pwright-api-request-connector-socks5 \
            --all-targets -- -D warnings
          CARGO_INCREMENTAL=0 cargo clippy --release --locked \
            -p pwright-node-addon --no-default-features \
            --features api-request-client-certificates,api-request-http-proxy,api-request-socks5-proxy \
            --all-targets --no-deps -- -D warnings
          PWRIGHT_NATIVE_PROFILE=api-request-client-certificates-http-proxy \
            CARGO_INCREMENTAL=0 pnpm build
          PWRIGHT_NATIVE_PROFILE=api-request-client-certificates-http-proxy \
            pnpm test:native-load
          PWRIGHT_NATIVE_PROFILE=api-request-client-certificates-socks5-proxy \
            CARGO_INCREMENTAL=0 pnpm build
          PWRIGHT_NATIVE_PROFILE=api-request-client-certificates-socks5-proxy \
            pnpm test:native-load
