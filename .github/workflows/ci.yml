      - name: Replay and verify all Core455 private source-only invocations without browsers
        if: matrix.node-version == '20'
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          upstream="$GITHUB_WORKSPACE/.work/core455-upstream"
          manifest="$GITHUB_WORKSPACE/tests/official/playwright-core-internal-source-only-manifest.json"
          test -f packages/pwright/native/pwright.node
          node scripts/bootstrap_playwright_core455_source_only.cjs "$upstream"
          results="$(mktemp -d "$RUNNER_TEMP/pwright-core455.XXXXXX")"
          verified=0
          for suite in core455-internal-viewport-library core455-internal-viewport-bidi core455-internal-glob-library core455-internal-glob-bidi; do
            case "$suite" in
              *-bidi) expected=6 ;;
              *-library) expected=3 ;;
              *) exit 1 ;;
            esac
            node tests/official/playwright-core-internal-source-only-guard.cjs --check \
              "$manifest" "$suite" "$upstream"
            for mode in oracle candidate; do
              result="$results/$mode-$suite.json"
              command=(uv run --no-project python scripts/run_playwright_official_conformance.py \
                "$mode" "$upstream" --manifest "$manifest" --suite "$suite" --result "$result")
              if test "$mode" = candidate; then
                command+=(--candidate packages/pwright --candidate-profile default)
              fi
              "${command[@]}"
              sidecar="${result%.json}.provenance.json"
              uv run --no-project python scripts/verify_playwright_official_provenance.py "$sidecar"
              jq -e --arg mode "$mode" --arg suite "$suite" --argjson expected "$expected" \
                '.schema == 3 and .mode == $mode and .suite == $suite and .exitCode == 0 and
                 .sourceOnlyExecution.scope == "upstream-private-source-only" and
                 .sourceOnlyExecution.reportedTests == $expected and
                 .sourceOnlyExecution.candidateRuntimeAttested == false and
                 .sourceOnlyExecution.publicApiParityEvidence == false' "$sidecar"
              verified=$((verified + 1))
            done
          done
          test "$verified" -eq 8
          test "$(find "$results" -maxdepth 1 -type f -name '*.provenance.json' | wc -l)" -eq 8
