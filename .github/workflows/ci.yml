          node --check tests/official/playwright-core-server-connect-close-error-strict-v5-preload.cjs
          uv run --no-project --with ruff==0.13.2 ruff check \
            --config packages/pwright-python/pyproject.toml --ignore E501 \
            scripts/run_playwright_core_server_connect_close_error_strict_v5.py \
            scripts/verify_playwright_core_server_connect_close_error_strict_v5.py \
            scripts/verify_playwright_core_server_connect_close_error_strict_v5_pair.py \
            scripts/test_verify_playwright_core_server_connect_close_error_strict_v5.py \
            scripts/test_verify_playwright_core_server_connect_close_error_strict_v5_pair.py
          # Source-pin replay requires the locally preserved Playwright checkout;
          # CI still executes all synthetic mapping, ordering and Close controls.
          PYTHONPATH=scripts uv run --no-project --with pytest==8.4.2 \
            python -m pytest -q \
            -k 'not pinned_source_and_manifest_select_custom_close' \
            scripts/test_verify_playwright_core_server_connect_close_error_strict_v5.py \
            scripts/test_verify_playwright_core_server_connect_close_error_strict_v5_pair.py
      - name: Verify fixture-adapted Core Server-connect header diagnostic tools
        run: |
          node --check tests/official/playwright-core-server-connect-headers-strict-v1-preload.cjs
          uv run --no-project --with ruff==0.13.2 ruff check \
            --config packages/pwright-python/pyproject.toml --ignore E501 \
            scripts/run_playwright_core_server_connect_headers_strict_v1.py \
            scripts/verify_playwright_core_server_connect_headers_strict_v1.py \
            scripts/test_verify_playwright_core_server_connect_headers_strict_v1.py \
            scripts/run_playwright_core_server_connect_headers_post_refactor_v2.py \
            scripts/verify_playwright_core_server_connect_headers_post_refactor_v2.py \
            scripts/test_verify_playwright_core_server_connect_headers_post_refactor_v2.py
          # The source-pin case requires the local Playwright 1.58.0 clone;
          # CI runs all clone-free selector/receipt negative controls.
          PYTHONPATH=scripts uv run --no-project --with pytest==8.4.2 \
            python -m pytest -q \
            -k 'not test_local_pinned_source_assertions_and_manifest_are_unchanged' \
            scripts/test_verify_playwright_core_server_connect_headers_strict_v1.py \
            scripts/test_verify_playwright_core_server_connect_headers_post_refactor_v2.py
      - name: Verify Python dummy-engine strict-v2 evidence tools without browsers
        run: |
          uv run --no-project --with ruff==0.13.2 ruff format --check \
            --config packages/pwright-python/pyproject.toml \
            scripts/run_playwright_python_dummy_engine_strict_v2.py \
            scripts/verify_playwright_python_dummy_engine_strict_v2.py \
            scripts/promote_playwright_python_dummy_engine_strict_v2.py \
            scripts/test_verify_playwright_python_dummy_engine_strict_v2.py \
            scripts/test_promote_playwright_python_dummy_engine_strict_v2.py \
            packages/pwright-python/tests/official/dummy_engine_guard_strict_v2/node \
            packages/pwright-python/tests/official/dummy_engine_guard_strict_v2/pwright_official_dummy_engine_guard_v2.py
          uv run --no-project --with ruff==0.13.2 ruff check \
            --config packages/pwright-python/pyproject.toml \
            scripts/run_playwright_python_dummy_engine_strict_v2.py \
            scripts/verify_playwright_python_dummy_engine_strict_v2.py \
            scripts/promote_playwright_python_dummy_engine_strict_v2.py \
            scripts/test_verify_playwright_python_dummy_engine_strict_v2.py \
            scripts/test_promote_playwright_python_dummy_engine_strict_v2.py \
            packages/pwright-python/tests/official/dummy_engine_guard_strict_v2/node \
            packages/pwright-python/tests/official/dummy_engine_guard_strict_v2/pwright_official_dummy_engine_guard_v2.py
          PYTHONPATH=scripts uv run --no-project --with pytest==8.4.2 \
            python -m pytest -q \
            scripts/test_verify_playwright_python_dummy_engine_strict_v2.py \
            scripts/test_promote_playwright_python_dummy_engine_strict_v2.py
      - name: Verify Playwright Server close evidence tools without browsers
        run: |
          uv run --no-project --with ruff==0.13.2 ruff format --check \
            --config packages/pwright-python/pyproject.toml \
            scripts/run_playwright_python_connect_close_strict_v2.py \
            scripts/verify_playwright_python_connect_close_strict_v2.py \
            scripts/promote_playwright_python_connect_close_strict_v2.py \
            scripts/test_verify_playwright_python_connect_close_strict_v2.py \
            scripts/test_promote_playwright_python_connect_close_strict_v2.py \
            packages/pwright-python/tests/official/ws_connect_guard_strict_v2/pwright_official_connect_guard_v2.py
          uv run --no-project --with ruff==0.13.2 ruff check \
            --config packages/pwright-python/pyproject.toml \
            scripts/run_playwright_python_connect_close_strict_v2.py \
            scripts/verify_playwright_python_connect_close_strict_v2.py \
            scripts/promote_playwright_python_connect_close_strict_v2.py \
            scripts/test_verify_playwright_python_connect_close_strict_v2.py \
            scripts/test_promote_playwright_python_connect_close_strict_v2.py \
            packages/pwright-python/tests/official/ws_connect_guard_strict_v2/pwright_official_connect_guard_v2.py
          PYTHONPATH=scripts uv run --no-project --with pytest==8.4.2 \
            python -m pytest -q \
            scripts/test_verify_playwright_python_connect_close_strict_v2.py \
            scripts/test_promote_playwright_python_connect_close_strict_v2.py
      - name: Build and compare two release wheels
        working-directory: packages/pwright-python
        run: |
          uv run --no-project --with maturin==1.15.0 maturin build \
            --release --locked --auditwheel repair --out dist-a
          uv run --no-project --with maturin==1.15.0 maturin build \
            --release --locked --auditwheel repair --out dist-b
          first=$(find dist-a -maxdepth 1 -type f -name 'shuozeli_pwright-*.whl' -print -quit)
          second=$(find dist-b -maxdepth 1 -type f -name 'shuozeli_pwright-*.whl' -print -quit)
          uv run --no-project python ../../scripts/check_python_wheel_reproducibility.py \
            "$first" "$second"
      - name: Install the wheel outside the source tree and run ABI/unit smoke
        working-directory: packages/pwright-python
        run: |
          wheel=$(find dist-a -maxdepth 1 -type f -name 'shuozeli_pwright-*.whl' -print -quit)
          uv venv "$RUNNER_TEMP/pwright-python-smoke" --python 3.12
          uv pip install --python "$RUNNER_TEMP/pwright-python-smoke/bin/python" "$wheel"
          uv pip install --python "$RUNNER_TEMP/pwright-python-smoke/bin/python" \
            pytest==8.4.2 pytest-asyncio==1.2.0
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pwright-python-smoke/bin/python" \
            "$GITHUB_WORKSPACE/packages/pwright-python/tests/smoke/import_child.py"
          "$RUNNER_TEMP/pwright-python-smoke/bin/python" -m pytest -q \
            "$GITHUB_WORKSPACE/packages/pwright-python/tests/unit"
      - name: Build and smoke opt-in Python Playwright Server remote Browser wheel
        working-directory: packages/pwright-python
        run: |
          uv run --no-project --with maturin==1.15.0 maturin build \
            --release --locked --auditwheel repair \
            --features pyo3/extension-module,browser-registry,playwright-server-initialize,playwright-server-connect-session \
            --out "$RUNNER_TEMP/pwright-python-server-wheel"
          wheel=$(find "$RUNNER_TEMP/pwright-python-server-wheel" -maxdepth 1 \
            -type f -name 'shuozeli_pwright-*.whl' -print -quit)
          test -n "$wheel"
          uv venv "$RUNNER_TEMP/pwright-python-server-smoke" --python 3.12
          uv pip install --python "$RUNNER_TEMP/pwright-python-server-smoke/bin/python" \
            "$wheel" pytest==8.4.2 pytest-asyncio==1.2.0
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pwright-python-server-smoke/bin/python" -c \
            'from pwright._abi import native_capabilities; from pwright import _native; c = native_capabilities(); assert c["abi"] == 125 and set(c["features"]) == {"browser-registry", "playwright-server-initialize", "playwright-server-connect-session"}; assert callable(getattr(_native.NativeRemoteContext, "close", None))'
          "$RUNNER_TEMP/pwright-python-server-smoke/bin/python" -m pytest -q \
            "$GITHUB_WORKSPACE/packages/pwright-python/tests/unit/test_playwright_server_connect_facade.py" \
            "$GITHUB_WORKSPACE/packages/pwright-python/tests/unit/test_playwright_server_native_connect.py" \
            "$GITHUB_WORKSPACE/packages/pwright-python/tests/unit/test_playwright_server_remote_close_events.py"
      - name: Verify pinned official Playwright Python corpus and candidate collection
        run: |
          git clone --depth 1 --branch v1.58.0 \
            https://github.com/microsoft/playwright-python.git \
            "$RUNNER_TEMP/playwright-python-1.58.0"
          uv run --no-project python scripts/check_playwright_python_official_source.py \
            "$RUNNER_TEMP/playwright-python-1.58.0"
          uv run --no-project python scripts/check_playwright_python_official_source.py \
            "$RUNNER_TEMP/playwright-python-1.58.0" \
            --manifest packages/pwright-python/tests/official/drag-and-drop-manifest.json
          uv run --no-project python scripts/check_playwright_python_official_source.py \
            "$RUNNER_TEMP/playwright-python-1.58.0" \
            --manifest packages/pwright-python/tests/official/page-dialogs-manifest.json
          uv run --no-project python scripts/check_playwright_python_official_source.py \
            "$RUNNER_TEMP/playwright-python-1.58.0" \
            --manifest packages/pwright-python/tests/official/route-fulfill-manifest.json
          uv run --no-project python scripts/check_playwright_python_official_source.py \
            "$RUNNER_TEMP/playwright-python-1.58.0" \
            --manifest packages/pwright-python/tests/official/page-route-binding-matchers-path-manifest.json
          uv run --no-project python scripts/check_playwright_python_official_source.py \
            "$RUNNER_TEMP/playwright-python-1.58.0" \
            --manifest packages/pwright-python/tests/official/route-request-response-manifest.json
          uv run --no-project python scripts/check_playwright_python_official_source.py \
            "$RUNNER_TEMP/playwright-python-1.58.0" \
            --manifest packages/pwright-python/tests/official/page-route-cors-preflight-manifest.json
          uv run --no-project python scripts/check_playwright_python_official_source.py \
            "$RUNNER_TEMP/playwright-python-1.58.0" \
            --manifest packages/pwright-python/tests/official/route-fulfill-api-response-manifest.json
          uv run --no-project python scripts/check_playwright_python_official_source.py \
            "$RUNNER_TEMP/playwright-python-1.58.0" \
            --manifest packages/pwright-python/tests/official/page-route-redirect-chain-manifest.json
          uv run --no-project python scripts/check_playwright_python_official_source.py \
            "$RUNNER_TEMP/playwright-python-1.58.0" \
            --manifest packages/pwright-python/tests/official/page-route-service-worker-manifest.json
          uv run --no-project python scripts/check_playwright_python_official_source.py \
            "$RUNNER_TEMP/playwright-python-1.58.0" \
            --manifest packages/pwright-python/tests/official/page-route-remaining-manifest.json
          uv run --no-project python scripts/check_playwright_python_official_source.py \
            "$RUNNER_TEMP/playwright-python-1.58.0" \
            --manifest packages/pwright-python/tests/official/browsercontext-route-remaining-manifest.json
          uv run --no-project python scripts/check_playwright_python_official_source.py \
            "$RUNNER_TEMP/playwright-python-1.58.0" \
            --manifest packages/pwright-python/tests/official/browsercontext-add-cookies-manifest.json
          uv run --no-project python scripts/check_playwright_python_official_source.py \
            "$RUNNER_TEMP/playwright-python-1.58.0" \
            --manifest packages/pwright-python/tests/official/browsercontext-clear-cookies-manifest.json
          uv run --no-project python scripts/check_playwright_python_official_source.py \
            "$RUNNER_TEMP/playwright-python-1.58.0" \
            --manifest packages/pwright-python/tests/official/browsercontext-cookies-manifest.json
          uv run --no-project python scripts/check_playwright_python_official_source.py \
            "$RUNNER_TEMP/playwright-python-1.58.0" \
            --manifest packages/pwright-python/tests/official/download-terminal-manifest.json
          uv run --no-project python scripts/check_playwright_python_official_source.py \
            "$RUNNER_TEMP/playwright-python-1.58.0" \
            --manifest packages/pwright-python/tests/official/persistent-context-manifest.json
          uv run --no-project python scripts/check_playwright_python_official_source.py \
            "$RUNNER_TEMP/playwright-python-1.58.0" \
            --manifest packages/pwright-python/tests/official/page-pause-manifest.json
          uv run --no-project python scripts/check_playwright_python_official_source.py \
            "$RUNNER_TEMP/playwright-python-1.58.0" \
            --manifest packages/pwright-python/tests/official/page-request-gc-manifest.json
          uv run --no-project python scripts/check_playwright_python_official_source.py \
            "$RUNNER_TEMP/playwright-python-1.58.0" \
            --manifest packages/pwright-python/tests/official/page-errors-history-manifest.json
          uv run --no-project python scripts/check_playwright_python_official_source.py \
            "$RUNNER_TEMP/playwright-python-1.58.0" \
            --manifest packages/pwright-python/tests/official/console-history-manifest.json
          uv run --no-project python scripts/check_playwright_python_official_source.py \
            "$RUNNER_TEMP/playwright-python-1.58.0" \
            --manifest packages/pwright-python/tests/official/request-history-manifest.json
          uv run --no-project python scripts/check_playwright_python_official_source.py \
            "$RUNNER_TEMP/playwright-python-1.58.0" \
            --manifest packages/pwright-python/tests/official/device-descriptors-manifest.json
          uv run --no-project python scripts/check_playwright_python_official_source.py \
            "$RUNNER_TEMP/playwright-python-1.58.0" \
            --manifest packages/pwright-python/tests/official/async-listeners-manifest.json
          uv run --no-project python scripts/check_playwright_python_official_source.py \
            "$RUNNER_TEMP/playwright-python-1.58.0" \
            --manifest packages/pwright-python/tests/official/fetch-browser-context-manifest.json
          uv run --no-project python scripts/check_playwright_python_official_source.py \
            "$RUNNER_TEMP/playwright-python-1.58.0" \
            --manifest packages/pwright-python/tests/official/route-fetch-manifest.json
          uv run --no-project python scripts/check_playwright_python_official_source.py \
            "$RUNNER_TEMP/playwright-python-1.58.0" \
            --manifest packages/pwright-python/tests/official/route-request-fallback-manifest.json
          "$RUNNER_TEMP/pwright-python-smoke/bin/python" \
            scripts/run_playwright_python_official_conformance.py candidate \
            "$RUNNER_TEMP/playwright-python-1.58.0" --collect-only
      - name: Collect and hash the complete pinned official Python corpus
        run: |
          PYTHONPATH=scripts uv run --no-project python -m unittest \
            scripts.test_inventory_playwright_python_official_tests
          upstream="$RUNNER_TEMP/playwright-python-1.58.0"
          core_python="$RUNNER_TEMP/pwright-python-full-core/bin/python"
          examples_python="$RUNNER_TEMP/pwright-python-full-examples/bin/python"
          inventory="$RUNNER_TEMP/playwright-python-v1.58.0-profiled.jsonl"
          uv venv "$RUNNER_TEMP/pwright-python-full-core" --python 3.12
          uv pip install --python "$core_python" playwright==1.58.0 \
            -r "$upstream/local-requirements.txt"
          uv python install 3.10
          uv venv "$RUNNER_TEMP/pwright-python-full-examples" --python 3.10
          uv pip install --python "$examples_python" --require-hashes \
            -r packages/pwright-python/tests/official/examples-oracle-requirements.txt
          "$core_python" scripts/inventory_playwright_python_official_tests.py \
            "$upstream" --examples-python "$examples_python" --output "$inventory"
          test "$(sha256sum "$inventory" | cut -d ' ' -f1)" = \
            "3dfb11b6ad7eb4736166ee2c4f7fa32cda78063324ad8314ce12f3e2d49b9d41"

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  integration-chrome:
    name: Integration Tests (Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run integration tests in Docker
        working-directory: tests/integration
        run: docker compose up --build --abort-on-container-exit --exit-code-from test-runner
        timeout-minutes: 15

      - name: Show logs on failure
        if: failure()
        working-directory: tests/integration
        run: docker compose logs

      - name: Tear down
        if: always()
        working-directory: tests/integration
        run: docker compose down

  integration-lightpanda:
    name: Integration Tests (Lightpanda)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run integration tests in Docker
        working-directory: tests/integration
        run: docker compose -f docker-compose.lightpanda.yml up --build --abort-on-container-exit --exit-code-from test-runner
        timeout-minutes: 15

      - name: Show logs on failure
        if: failure()
        working-directory: tests/integration
        run: docker compose -f docker-compose.lightpanda.yml logs

      - name: Tear down
        if: always()
        working-directory: tests/integration
        run: docker compose -f docker-compose.lightpanda.yml down

  integration-firefox:
    name: Integration Tests (Firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run integration tests in Docker
        working-directory: tests/integration
        run: docker compose -f docker-compose.firefox.yml up --build --abort-on-container-exit --exit-code-from test-runner
        timeout-minutes: 15

      - name: Show logs on failure
        if: failure()
        working-directory: tests/integration
        run: docker compose -f docker-compose.firefox.yml logs

      - name: Tear down
        if: always()
        working-directory: tests/integration
        run: docker compose -f docker-compose.firefox.yml down
