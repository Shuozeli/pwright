      - name: Verify opt-in CDP default User-Agent native composition
        if: matrix.node-version == '20'
        working-directory: packages/pwright
        run: |
          RUSTFLAGS="" CARGO_BUILD_JOBS=1 CARGO_INCREMENTAL=0 \
            PWRIGHT_NATIVE_PROFILE=official-conformance-page-cdp-default-user-agent \
            pnpm build
          PWRIGHT_NATIVE_PROFILE=official-conformance-page-cdp-default-user-agent \
            pnpm test:native-load
