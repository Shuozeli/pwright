name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Check & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets
      - name: Verify bridge test-support dependency boundary
        run: bash scripts/check-bridge-test-utils-dependencies.sh
      - name: Verify Chromium session-initialization plugin boundary
        run: bash scripts/check-v2-chromium-session-initialization-dependencies.sh
      - name: Verify Chromium frame-observer plugin boundary
        run: bash scripts/check-v2-chromium-frame-observer-dependencies.sh
      - name: Verify Chromium frame-lifecycle plugin boundary
        run: bash scripts/check-v2-chromium-frame-lifecycle-dependencies.sh
      - name: Verify navigation-only dependency boundary
        run: bash scripts/check-v2-navigation-dependencies.sh
      - name: Verify optional Rust extra HTTP header policy
        run: |
          CARGO_INCREMENTAL=0 cargo test --release --locked -p pwright-network-model --features extra-headers
          CARGO_INCREMENTAL=0 cargo clippy --release --locked -p pwright-network-model --all-targets --features extra-headers -- -D warnings
      - name: Verify opt-in Chromium startup log dependency and behavior boundary
        run: |
          CARGO_INCREMENTAL=0 cargo test --release --locked -p pwright-provider-chromium --no-default-features --lib
          CARGO_INCREMENTAL=0 cargo test --release --locked -p pwright-provider-chromium --features startup-logs --lib
          CARGO_INCREMENTAL=0 cargo test --release --locked -p pwright-composition-chromium-launch --no-default-features --lib
          CARGO_INCREMENTAL=0 cargo test --release --locked -p pwright-composition-chromium-launch --features startup-logs --lib
          CARGO_INCREMENTAL=0 cargo clippy --release --locked -p pwright-provider-chromium -p pwright-composition-chromium-launch --all-targets --no-default-features -- -D warnings
          CARGO_INCREMENTAL=0 cargo clippy --release --locked -p pwright-provider-chromium -p pwright-composition-chromium-launch --all-targets --features pwright-composition-chromium-launch/startup-logs -- -D warnings
      - name: Verify independent bounded Playwright v8 trace writer and Context lifecycle
        run: |
          CARGO_INCREMENTAL=0 cargo test --release --locked -p pwright-trace-playwright-v8 --lib
          CARGO_INCREMENTAL=0 cargo clippy --release --locked -p pwright-trace-playwright-v8 --all-targets -- -D warnings
          CARGO_INCREMENTAL=0 cargo test --release --locked -p pwright-trace-playwright-v8-context --lib
          CARGO_INCREMENTAL=0 cargo clippy --release --locked -p pwright-trace-playwright-v8-context --all-targets -- -D warnings
          cargo tree --locked -p pwright-node-host --no-default-features -e normal > "$RUNNER_TEMP/pwright-node-default-tree.txt"
          ! grep -q pwright-trace-playwright-v8 "$RUNNER_TEMP/pwright-node-default-tree.txt"
          ! grep -q pwright-trace-playwright-v8-context "$RUNNER_TEMP/pwright-node-default-tree.txt"
          cargo tree --locked -p pwright-node-host --no-default-features --features playwright-trace -e normal | grep -q pwright-trace-playwright-v8
      - name: Verify standalone opt-in WebSocket transport boundary
        run: |
          CARGO_INCREMENTAL=0 cargo test --release --locked -p pwright-transport-ws --no-default-features --lib
          CARGO_INCREMENTAL=0 cargo test --release --locked -p pwright-transport-ws --features live-tokio
          CARGO_INCREMENTAL=0 cargo clippy --release --locked -p pwright-transport-ws --all-targets --no-default-features -- -D warnings
          CARGO_INCREMENTAL=0 cargo clippy --release --locked -p pwright-transport-ws --all-targets --features live-tokio -- -D warnings
          ! cargo tree --locked -p pwright-transport-ws --no-default-features -e normal | grep -q tungstenite
          cargo tree --locked -p pwright-transport-ws --features live-tokio --prefix none -e normal > "$RUNNER_TEMP/pwright-ws-selected-tree.txt"
          grep -q '^pwright-tokio-tungstenite v0.26.2-pwright.1' "$RUNNER_TEMP/pwright-ws-selected-tree.txt"
          grep -q '^pwright-tungstenite v0.26.2-pwright.1' "$RUNNER_TEMP/pwright-ws-selected-tree.txt"
          ! grep -Eq '^(tokio-tungstenite|tungstenite) v' "$RUNNER_TEMP/pwright-ws-selected-tree.txt"
          ! cargo tree --locked -p pwright-node-host --no-default-features -e normal | grep -q pwright-transport-ws
          ! cargo tree --locked -p pwright-python-addon --no-default-features -e normal | grep -q pwright-transport-ws
      - name: Verify browser-neutral owned-process startup remains opt-in
        run: |
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo test --release --locked \
            -p pwright-owned-process-startup --lib
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo check --release --locked \
            -p pwright-python-addon --no-default-features \
            --features owned-process-startup
          cargo tree --locked -p pwright-python-addon --no-default-features \
            -e normal > "$RUNNER_TEMP/pwright-python-owned-process-default-tree.txt"
          cargo tree --locked -p pwright-python-addon --no-default-features \
            --features owned-process-startup -e normal \
            > "$RUNNER_TEMP/pwright-python-owned-process-selected-tree.txt"
          ! grep -F pwright-owned-process-startup \
            "$RUNNER_TEMP/pwright-python-owned-process-default-tree.txt"
          grep -F pwright-owned-process-startup \
            "$RUNNER_TEMP/pwright-python-owned-process-selected-tree.txt"
      - name: Verify Playwright Server initialization remains opt-in
        run: |
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo test --release --locked \
            -p pwright-playwright-server-client-core --lib
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo test --release --locked \
            -p pwright-playwright-server-initialize --lib
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo clippy --release --locked \
            -p pwright-playwright-server-initialize --all-targets -- -D warnings
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo test --release --locked \
            -p pwright-playwright-server-session --no-default-features --lib
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo test --release --locked \
            -p pwright-playwright-server-session --no-default-features \
            --features live-tokio --lib
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo test --release --locked \
            -p pwright-playwright-server-session --no-default-features \
            --features supervisor --lib
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo test --release --locked \
            -p pwright-playwright-server-session --all-features --lib
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo clippy --release --locked \
            -p pwright-playwright-server-session --all-targets \
            --all-features -- -D warnings
          ! cargo tree --locked -p pwright-playwright-server-session \
            --no-default-features -e normal | grep -q tungstenite
          ! cargo tree --locked -p pwright-node-addon --no-default-features \
            -e normal | grep -q pwright-playwright-server-session
          ! cargo tree --locked -p pwright-python-addon --no-default-features \
            -e normal | grep -q pwright-playwright-server-session
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo test --release --locked \
            -p pwright-playwright-server-endpoint-discovery --no-default-features
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo test --release --locked \
            -p pwright-playwright-server-endpoint-discovery --all-features
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo clippy --release --locked \
            -p pwright-playwright-server-endpoint-discovery --all-targets \
            --all-features -- -D warnings
          ! cargo tree --locked -p pwright-playwright-server-endpoint-discovery \
            --no-default-features -e normal | grep -q reqwest
          ! cargo tree --locked -p pwright-playwright-server-endpoint-discovery \
            --no-default-features -e normal | grep -q tokio
          ! cargo tree --locked -p pwright-node-addon --no-default-features \
            -e normal | grep -q pwright-playwright-server-endpoint-discovery
          ! cargo tree --locked -p pwright-python-addon --no-default-features \
            -e normal | grep -q pwright-playwright-server-endpoint-discovery
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo test --release --locked \
            -p pwright-playwright-server-connect --no-default-features --lib
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo test --release --locked \
            -p pwright-playwright-server-connect --all-features --lib
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo clippy --release --locked \
            -p pwright-playwright-server-connect --all-targets \
            --all-features -- -D warnings
          ! cargo tree --locked -p pwright-playwright-server-connect \
            --no-default-features -e normal | grep -q reqwest
          ! cargo tree --locked -p pwright-playwright-server-connect \
            --no-default-features -e normal | grep -q tungstenite
          ! cargo tree --locked -p pwright-node-addon --no-default-features \
            -e normal | grep -q pwright-playwright-server-connect
          ! cargo tree --locked -p pwright-python-addon --no-default-features \
            -e normal | grep -q pwright-playwright-server-connect
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo test --release --locked \
            -p pwright-playwright-server-browser-ops --no-default-features --lib
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo clippy --release --locked \
            -p pwright-playwright-server-browser-ops --all-targets \
            --no-default-features -- -D warnings
          ! cargo tree --locked -p pwright-playwright-server-browser-ops \
            --no-default-features -e normal | grep -q tungstenite
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo check --release --locked \
            -p pwright-python-addon --no-default-features \
            --features playwright-server-initialize
          cargo tree --locked -p pwright-python-addon --no-default-features \
            -e normal > "$RUNNER_TEMP/pwright-python-server-default-tree.txt"
          cargo tree --locked -p pwright-python-addon --no-default-features \
            --features playwright-server-initialize -e normal \
            > "$RUNNER_TEMP/pwright-python-server-selected-tree.txt"
          ! grep -F pwright-playwright-server-initialize \
            "$RUNNER_TEMP/pwright-python-server-default-tree.txt"
          grep -F pwright-playwright-server-initialize \
            "$RUNNER_TEMP/pwright-python-server-selected-tree.txt"
      - name: Verify opt-in Python Playwright Server remote Browser boundary
        run: |
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo clippy --release --locked \
            -p pwright-python-addon --all-targets --no-default-features \
            --features playwright-server-connect-session -- -D warnings
          cargo tree --locked -p pwright-python-addon --no-default-features \
            -e normal > "$RUNNER_TEMP/pwright-python-server-default-tree.txt"
          cargo tree --locked -p pwright-python-addon --no-default-features \
            --features playwright-server-connect-session -e normal \
            > "$RUNNER_TEMP/pwright-python-server-session-selected-tree.txt"
          ! grep -F pwright-playwright-server-connect \
            "$RUNNER_TEMP/pwright-python-server-default-tree.txt"
          ! grep -F pwright-playwright-server-browser-ops \
            "$RUNNER_TEMP/pwright-python-server-default-tree.txt"
          grep -F pwright-playwright-server-connect \
            "$RUNNER_TEMP/pwright-python-server-session-selected-tree.txt"
          grep -F pwright-playwright-server-session \
            "$RUNNER_TEMP/pwright-python-server-session-selected-tree.txt"
          grep -F pwright-playwright-server-browser-ops \
            "$RUNNER_TEMP/pwright-python-server-session-selected-tree.txt"
      - name: Verify opt-in Node Playwright Server DNS-error boundary
        run: |
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo check --release --locked \
            -p pwright-node-addon --no-default-features
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo clippy --release --locked \
            -p pwright-node-addon --all-targets --no-default-features \
            --features playwright-server-connect-ws-error -- -D warnings
          cargo tree --locked -p pwright-node-addon --no-default-features \
            -e normal > "$RUNNER_TEMP/pwright-node-server-default-tree.txt"
          cargo tree --locked -p pwright-node-addon --no-default-features \
            --features playwright-server-connect-ws-error -e normal \
            > "$RUNNER_TEMP/pwright-node-server-selected-tree.txt"
          ! grep -F pwright-transport-ws \
            "$RUNNER_TEMP/pwright-node-server-default-tree.txt"
          grep -F pwright-transport-ws \
            "$RUNNER_TEMP/pwright-node-server-selected-tree.txt"
          grep -F pwright-tokio-tungstenite \
            "$RUNNER_TEMP/pwright-node-server-selected-tree.txt"
          grep -F pwright-tungstenite \
            "$RUNNER_TEMP/pwright-node-server-selected-tree.txt"
      - name: Verify separate opt-in Node Playwright Server Close-error boundary
        run: |
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo clippy --release --locked \
            -p pwright-node-addon --all-targets --no-default-features \
            --features playwright-server-connect-close-error -- -D warnings
          cargo tree --locked -p pwright-node-addon --no-default-features \
            --features playwright-server-connect-close-error -e normal \
            > "$RUNNER_TEMP/pwright-node-server-close-selected-tree.txt"
          ! grep -F pwright-playwright-server-initialize \
            "$RUNNER_TEMP/pwright-node-server-default-tree.txt"
          grep -F pwright-playwright-server-initialize \
            "$RUNNER_TEMP/pwright-node-server-close-selected-tree.txt"
          grep -F pwright-transport-ws \
            "$RUNNER_TEMP/pwright-node-server-close-selected-tree.txt"
      - name: Verify separate opt-in Node Playwright Server header boundary
        run: |
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo test --release --locked \
            -p pwright-playwright-connect-headers --features server-ws
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo clippy --release --locked \
            -p pwright-node-addon --all-targets --no-default-features \
            --features playwright-server-connect-headers -- -D warnings
          cargo tree --locked -p pwright-node-addon --no-default-features \
            --features playwright-server-connect-headers -e normal \
            > "$RUNNER_TEMP/pwright-node-server-headers-selected-tree.txt"
          ! grep -F pwright-playwright-connect-headers \
            "$RUNNER_TEMP/pwright-node-server-default-tree.txt"
          grep -F pwright-playwright-connect-headers \
            "$RUNNER_TEMP/pwright-node-server-headers-selected-tree.txt"
          grep -F pwright-transport-ws \
            "$RUNNER_TEMP/pwright-node-server-headers-selected-tree.txt"
          ! grep -F pwright-playwright-server-initialize \
            "$RUNNER_TEMP/pwright-node-server-headers-selected-tree.txt"
      - name: Verify opt-in Node Playwright Server remote Browser boundary
        run: |
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo clippy --release --locked \
            -p pwright-node-addon --all-targets --no-default-features \
            --features playwright-server-connect-session -- -D warnings
          cargo tree --locked -p pwright-node-addon --no-default-features \
            --features playwright-server-connect-session -e normal \
            > "$RUNNER_TEMP/pwright-node-server-session-selected-tree.txt"
          ! grep -F pwright-playwright-server-connect \
            "$RUNNER_TEMP/pwright-node-server-default-tree.txt"
          ! grep -F pwright-playwright-server-browser-ops \
            "$RUNNER_TEMP/pwright-node-server-default-tree.txt"
          grep -F pwright-playwright-server-connect \
            "$RUNNER_TEMP/pwright-node-server-session-selected-tree.txt"
          grep -F pwright-playwright-server-session \
            "$RUNNER_TEMP/pwright-node-server-session-selected-tree.txt"
          grep -F pwright-playwright-server-browser-ops \
            "$RUNNER_TEMP/pwright-node-server-session-selected-tree.txt"
      - name: Verify opt-in Frame navigation 1.2 generated bindings
        run: |
          CARGO_INCREMENTAL=0 cargo run --release --locked -p pwright-schema-gen -- \
            --input crates/pwright-cap-navigation/schema/navigation-1.2.yml \
            --import crates/pwright-codec-common/schema/common.yml \
            --previous crates/pwright-cap-navigation/schema/baselines/1.1/navigation.yml \
            --output crates/pwright-codec-navigation/src/generated_schema_1_2.rs \
            --capability-output crates/pwright-cap-navigation/src/generated_capability_1_2.rs \
            --server-output crates/pwright-server-navigation/src/generated_server_1_2.rs --check
      - name: Verify selected Frame navigation typed contracts
        run: |
          CARGO_INCREMENTAL=0 cargo test --release --locked -p pwright-schema-gen -p pwright-cap-navigation -p pwright-codec-navigation -p pwright-client-navigation -p pwright-server-navigation --features pwright-server-navigation/frame-navigation,pwright-client-navigation/frame-navigation
          CARGO_INCREMENTAL=0 cargo clippy --release --locked -p pwright-cap-navigation -p pwright-codec-navigation -p pwright-client-navigation -p pwright-server-navigation --all-targets --features pwright-server-navigation/frame-navigation,pwright-client-navigation/frame-navigation -- -D warnings
      - name: Verify selected Rust host and composable Node FFI navigation
        run: |
          CARGO_INCREMENTAL=0 cargo test --release --locked -p pwright-node-host --features frame-navigation --lib
          CARGO_INCREMENTAL=0 cargo clippy --release --locked -p pwright-node-addon --all-targets --features frame-navigation -- -D warnings
          CARGO_INCREMENTAL=0 cargo clippy --release --locked -p pwright-node-addon --all-targets --features drag-runtime,frame-navigation -- -D warnings
          node packages/pwright/scripts/check-boundary.mjs
      - name: Verify composable Node request event profiles compile independently
        run: |
          RUSTFLAGS="" CARGO_INCREMENTAL=0 cargo check --release --locked -p pwright-node-addon --no-default-features --features request-events
          RUSTFLAGS="" CARGO_INCREMENTAL=0 cargo check --release --locked -p pwright-node-addon --no-default-features --features response-events
          RUSTFLAGS="" CARGO_INCREMENTAL=0 cargo check --release --locked -p pwright-node-addon --no-default-features --features response-finished
          RUSTFLAGS="" CARGO_INCREMENTAL=0 cargo check --release --locked -p pwright-node-addon --no-default-features --features request-post-data-json
      - name: Verify opt-in browser history navigation
        run: |
          CARGO_INCREMENTAL=0 cargo run --release --locked -p pwright-schema-gen -- \
            --input crates/pwright-cap-history-navigation/schema/history-navigation.yml \
            --import crates/pwright-codec-common/schema/common.yml \
            --output "$RUNNER_TEMP/pwright-history-navigation-schema.rs" \
            --capability-output crates/pwright-cap-history-navigation/src/generated_capability.rs \
            --reference-output crates/pwright-cap-history-navigation/schema/protocol-reference.md
          git diff --exit-code -- \
            crates/pwright-cap-history-navigation/src/generated_capability.rs \
            crates/pwright-cap-history-navigation/schema/protocol-reference.md
          CARGO_INCREMENTAL=0 cargo test --release --locked \
            -p pwright-cap-history-navigation --lib
          CARGO_INCREMENTAL=0 cargo test --release --locked \
            -p pwright-backend-cdp-navigation --features history-navigation \
            history::tests --lib
          CARGO_INCREMENTAL=0 cargo clippy --release --locked \
            -p pwright-node-addon --no-default-features \
            --features history-navigation --all-targets -- -D warnings
          CARGO_INCREMENTAL=0 cargo clippy --release --locked \
            -p pwright-python-addon --no-default-features \
            --features history-navigation --all-targets --no-deps -- -D warnings
      - name: Verify opt-in file-input preparation model
        run: |
          CARGO_INCREMENTAL=0 cargo test --release --locked -p pwright-file-input-model -p pwright-file-input-source -p pwright-file-input-fs -p pwright-file-input-tokio -p pwright-backend-cdp-file-input -p pwright-composition-chromium-file-input -p pwright-cdp
          CARGO_INCREMENTAL=0 cargo clippy --release --locked -p pwright-file-input-model -p pwright-file-input-source -p pwright-file-input-fs -p pwright-file-input-tokio -p pwright-backend-cdp-file-input -p pwright-composition-chromium-file-input -p pwright-cdp --all-targets -- -D warnings
          node scripts/check-v2-file-input-dependencies.mjs
      - name: Verify independently bounded large CDP commands
        run: |
          CARGO_INCREMENTAL=0 cargo test --release --locked -p pwright-cdp -p pwright-backend-cdp-file-input --features pwright-backend-cdp-file-input/large-commands
          CARGO_INCREMENTAL=0 cargo clippy --release --locked -p pwright-cdp -p pwright-backend-cdp-file-input --features pwright-backend-cdp-file-input/large-commands --all-targets -- -D warnings
      - name: Verify independent persistent target marking
        run: |
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo test --release --locked -p pwright-backend-cdp-file-input -p pwright-composition-chromium-file-input --features retained-target-marking --lib
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo clippy --release --locked -p pwright-backend-cdp-file-input -p pwright-composition-chromium-file-input --features retained-target-marking --all-targets -- -D warnings
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo test --release --locked -p pwright-backend-cdp-file-input -p pwright-composition-chromium-file-input --features retained-target-marking,retained-preflight,pwright-backend-cdp-file-input/large-commands --lib
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo clippy --release --locked -p pwright-backend-cdp-file-input -p pwright-composition-chromium-file-input --features retained-target-marking,retained-preflight,pwright-backend-cdp-file-input/large-commands --all-targets -- -D warnings
      - name: Verify selected safe-host file-input integration
        run: |
          CARGO_INCREMENTAL=0 cargo test --release --locked -p pwright-node-host -p pwright-composition-chromium-file-input --features pwright-node-host/file-input --lib
          CARGO_INCREMENTAL=0 cargo clippy --release --locked -p pwright-node-host --features file-input --all-targets -- -D warnings
          CARGO_INCREMENTAL=0 cargo clippy --release --locked -p pwright-node-addon --features file-input --all-targets -- -D warnings
      - name: Verify composable Page file-chooser events and native path leaves
        run: |
          CARGO_INCREMENTAL=0 cargo test --release --locked -p pwright-node-host --features file-chooser-events --lib page_file_chooser::tests
          CARGO_INCREMENTAL=0 cargo clippy --release --locked -p pwright-node-host -p pwright-python-addon --features pwright-python-addon/file-chooser-events --all-targets -- -D warnings
          CARGO_INCREMENTAL=0 cargo test --release --locked -p pwright-node-host --features file-chooser-native-paths --lib file_input::tests::colocated_file_chooser_paths_target_the_utility_world_object -- --exact
          CARGO_INCREMENTAL=0 cargo clippy --release --locked -p pwright-node-host -p pwright-python-addon --features pwright-python-addon/file-chooser-native-paths --all-targets -- -D warnings
          CARGO_INCREMENTAL=0 cargo test --release --locked -p pwright-node-host --no-default-features --features file-input-native-paths --lib file_input::native_paths::tests::directory_plan_selects_directory_prevalidation -- --exact
          CARGO_INCREMENTAL=0 cargo clippy --release --locked -p pwright-node-host --no-default-features --features file-input-native-paths --all-targets -- -D warnings
          CARGO_INCREMENTAL=0 cargo clippy --release --locked -p pwright-python-addon --no-default-features --features file-input-native-paths --all-targets --no-deps -- -D warnings
      - name: Verify optional native Handle publication and pending result ownership
        run: |
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo test --release --locked -p pwright-node-host --features handles --lib
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo test --release --locked -p pwright-node-host --features handles,file-input,concurrent-close,extra-headers,drag-runtime,frame-navigation --lib
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo clippy --release --locked -p pwright-node-host --features handles --all-targets -- -D warnings
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo clippy --release --locked -p pwright-node-host --features handles,file-input,concurrent-close,extra-headers,drag-runtime,frame-navigation --all-targets -- -D warnings
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo clippy --release --locked -p pwright-node-addon --features handles --all-targets -- -D warnings
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo clippy --release --locked -p pwright-composition-chromium-handle-evaluation --features frame-value --all-targets -- -D warnings
          CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=1 cargo clippy --release --locked -p pwright-composition-chromium-handle-evaluation --features handle-value --all-targets -- -D warnings
