          CARGO_INCREMENTAL=0 cargo test --release --locked -p pwright-runtime --no-default-features --features disposal-reservations,lifetime-handoff --lib
          CARGO_INCREMENTAL=0 cargo test --release --locked -p pwright-runtime --no-default-features --features disposal-reservations --doc
          CARGO_INCREMENTAL=0 cargo clippy --release --locked -p pwright-runtime --all-targets --no-default-features --features disposal-reservations,lifetime-handoff -- -D warnings
          CARGO_INCREMENTAL=0 cargo clippy --release --locked -p pwright-runtime --all-targets --no-default-features -- -D warnings
          bash scripts/check-v2-runtime-reservations-dependencies.sh
      - name: Verify context-lifecycle-only dependency boundary
        run: bash scripts/check-v2-context-lifecycle-dependencies.sh
      - name: Verify Context-lifecycle composition dependency boundary
        run: bash scripts/check-v2-context-lifecycle-composition-dependencies.sh
      - name: Verify Context-creation composition dependency boundary
