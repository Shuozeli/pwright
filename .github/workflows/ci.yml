            node --test test/cdp-default-user-agent-native.test.mjs
          PWRIGHT_NATIVE_PROFILE=official-conformance-page-cdp-default-user-agent \
            pnpm test
          base_features="$(node -p "require('./src/native-artifact.cjs').nativeFeatures('official-conformance-page-cdp-handshake-headers').join(',')")"
          selected_features="$(node -p "require('./src/native-artifact.cjs').nativeFeatures('official-conformance-page-cdp-default-user-agent').join(',')")"
          deps_dir="$(mktemp -d)"
          cargo tree --offline --locked -e normal -p pwright-node-addon \
            --no-default-features --features "$base_features" --prefix none \
