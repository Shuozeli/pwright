[package]
name = "pwright-backend-cdp-page-lifecycle"
description = "Isolated Chromium CDP Page lifecycle adapter for Pwright"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
native-confirmation = ["dep:serde_json"]

[dependencies]
pwright-backend-cdp-common = { workspace = true }
pwright-cap-page-lifecycle = { workspace = true }
pwright-cdp = { workspace = true }
pwright-core = { workspace = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
futures-util = { workspace = true }
tokio-tungstenite = { workspace = true }
pwright-fake = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
