[package]
name = "pwright-backend-cdp-selector-geometry"
description = "Bounded first-party Chromium selector-to-geometry plugin for Pwright"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
pwright-backend-cdp-common = { workspace = true }
pwright-backend-cdp-locator-screenshot = { workspace = true }
pwright-backend-cdp-selector-runtime = { workspace = true }
pwright-cap-locator-screenshot = { workspace = true }
pwright-cdp = { workspace = true }
pwright-core = { workspace = true }
pwright-selector-model = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
pwright-browser-provider = { workspace = true }
pwright-fake = { workspace = true }
pwright-provider-cdp = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
