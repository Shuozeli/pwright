format: 1
capability: pwright.page_lifecycle
version: { major: 1, minor: 0 }
root: pwright.page_lifecycle
imports:
  - pwright.common
commands:
  - id: page.close
    name: page_close
    method: 196610
    targets: [pwright.browser.page]
    command: page_close_command
    result: page_close_result
    params_type: pwright.page_lifecycle.page_close_options
    result_type: pwright.page_lifecycle.page_close_success
    error_details_type: pwright.page_lifecycle.error_details
  - id: page.run_before_unload
    name: page_run_before_unload
    method: 196611
    targets: [pwright.browser.page]
    command: page_run_before_unload_command
    result: page_run_before_unload_result
    params_type: pwright.page_lifecycle.page_run_before_unload_options
    result_type: pwright.page_lifecycle.page_run_before_unload_success
    error_details_type: pwright.page_lifecycle.error_details
types:
  - kind: tagged_union
    id: pwright.page_lifecycle
    variants:
      - tag: 1
        name: page_close_command
        fields:
          - { name: call_id, type: u64 }
          - { name: object_id, type: u64 }
          - { name: metadata, type: message, target: pwright.common.call_metadata }
          - { name: options, type: message, target: pwright.page_lifecycle.page_close_options }
      - tag: 2
        name: page_close_result
        fields:
          - { name: call_id, type: u64 }
          - { name: outcome, type: message, target: pwright.page_lifecycle.outcome }
      - tag: 3
        name: page_run_before_unload_command
        fields:
          - { name: call_id, type: u64 }
          - { name: object_id, type: u64 }
          - { name: metadata, type: message, target: pwright.common.call_metadata }
          - { name: options, type: message, target: pwright.page_lifecycle.page_run_before_unload_options }
      - tag: 4
        name: page_run_before_unload_result
        fields:
          - { name: call_id, type: u64 }
          - { name: outcome, type: message, target: pwright.page_lifecycle.outcome }
  - kind: record
    id: pwright.page_lifecycle.error
    fields:
      - { name: failure_kind, type: enum, target: pwright.common.failure_kind }
      - { name: message, type: utf8 }
      - name: details
        type: message
        target: pwright.page_lifecycle.error_details
        cardinality: optional
  - kind: tagged_union
    id: pwright.page_lifecycle.error_details
    public_name: page_lifecycle_error_details
    variants:
      - tag: 0
        name: invalid_backend_response
        fields:
          - { name: message, type: utf8 }
      - tag: 1
        name: target_still_open
        fields:
          - { name: message, type: utf8 }
      - tag: 2
        name: backend
        fields:
          - { name: message, type: utf8 }
  - kind: tagged_union
    id: pwright.page_lifecycle.outcome
    variants:
      - { tag: 0, name: success, fields: [] }
      - tag: 1
        name: error
        fields:
          - { name: error, type: message, target: pwright.page_lifecycle.error }
  - kind: record
    id: pwright.page_lifecycle.page_close_options
    public_name: page_close_options
    public_external: true
    fields: []
  - kind: record
    id: pwright.page_lifecycle.page_close_success
    public_name: page_close_result
    public_external: true
    fields: []
  - kind: record
    id: pwright.page_lifecycle.page_run_before_unload_options
    public_name: page_run_before_unload_options
    public_external: true
    fields: []
  - kind: record
    id: pwright.page_lifecycle.page_run_before_unload_success
    public_name: page_run_before_unload_result
    public_external: true
    fields: []
