[package]
name = "pwright"
description = "No-default-features umbrella for composable Pwright Rust v2 components"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
core = ["dep:pwright-core"]
navigation = ["core", "dep:pwright-cap-navigation"]
evaluation = ["core", "dep:pwright-cap-evaluation"]
content = ["core", "dep:pwright-cap-content"]
context-lifecycle = ["core", "dep:pwright-cap-context-lifecycle"]
page-lifecycle = ["core", "dep:pwright-cap-page-lifecycle"]
page-creation = ["core", "page-lifecycle", "dep:pwright-cap-page-creation"]
handle-lifecycle = ["core", "dep:pwright-cap-handle-lifecycle"]
handle-evaluation = ["core", "handle-lifecycle", "dep:pwright-cap-handle-evaluation"]
ordered-handle-delivery = [
    "handle-evaluation",
    "runtime",
    "transport",
    "dep:pwright-plugin-ordered-handle-delivery",
]
context-creation = [
    "core",
    "context-lifecycle",
    "dep:pwright-cap-context-creation",
]
locator = ["core", "dep:pwright-cap-locator"]
locator-screenshot = ["core", "dep:pwright-cap-locator-screenshot"]
dom-content = ["core", "dep:pwright-cap-dom-content"]
page-events = ["core", "dep:pwright-cap-page-events"]
network-events = ["core", "dep:pwright-cap-network-events"]
client = ["core", "dep:pwright-client"]
client-navigation = ["client", "navigation", "dep:pwright-client-navigation"]
client-evaluation = ["client", "evaluation", "dep:pwright-client-evaluation"]
client-content = ["client", "content", "dep:pwright-client-content"]
client-context-lifecycle = [
    "client",
    "context-lifecycle",
    "dep:pwright-client-context-lifecycle",
]
client-page-lifecycle = [
    "client",
    "page-lifecycle",
    "dep:pwright-client-page-lifecycle",
]
client-page-creation = [
    "client",
    "page-creation",
    "client-page-lifecycle",
    "dep:pwright-client-page-creation",
]
client-handle-lifecycle = [
    "client",
    "handle-lifecycle",
    "dep:pwright-client-handle-lifecycle",
]
client-handle-evaluation = [
    "client",
    "handle-evaluation",
    "client-handle-lifecycle",
    "dep:pwright-client-handle-evaluation",
]
client-context-creation = [
    "client",
    "context-creation",
    "client-context-lifecycle",
    "dep:pwright-client-context-creation",
]
client-locator = ["client", "locator", "dep:pwright-client-locator"]
client-locator-screenshot = [
    "client",
    "locator-screenshot",
    "dep:pwright-client-locator-screenshot",
]
client-dom-content = ["client", "dom-content", "dep:pwright-client-dom-content"]
client-page-events = ["client", "page-events", "dep:pwright-client-page-events"]
client-network-events = [
    "client",
    "network-events",
    "dep:pwright-client-network-events",
]
cdp = ["dep:pwright-cdp"]
chromium-content = [
    "cdp",
    "content",
    "dep:pwright-composition-chromium-content",
]
chromium-context-lifecycle = [
    "cdp",
    "context-lifecycle",
    "runtime",
    "dep:pwright-composition-chromium-context-lifecycle",
]
chromium-page-lifecycle = [
    "cdp",
    "page-lifecycle",
    "runtime",
    "dep:pwright-composition-chromium-page-lifecycle",
]
chromium-page-creation = [
    "cdp",
    "runtime",
    "page-creation",
    "chromium-page-lifecycle",
    "dep:pwright-composition-chromium-page-creation",
]
chromium-handle-lifecycle = [
    "cdp",
    "handle-lifecycle",
    "runtime",
    "dep:pwright-composition-chromium-handle-lifecycle",
]
chromium-handle-evaluation = [
    "cdp",
    "runtime",
    "handle-evaluation",
    "chromium-handle-lifecycle",
    "dep:pwright-composition-chromium-handle-evaluation",
]
chromium-context-creation = [
    "cdp",
    "runtime",
    "context-creation",
    "chromium-context-lifecycle",
    "dep:pwright-composition-chromium-context-creation",
]
chromium-locator = [
    "cdp",
    "locator",
    "dep:pwright-composition-chromium-locator",
]
chromium-locator-screenshot = [
    "chromium-selector-geometry",
    "cdp",
    "locator-screenshot",
    "dep:pwright-composition-chromium-locator-screenshot",
]
chromium-selector-geometry = [
    "cdp",
    "locator-screenshot",
    "dep:pwright-backend-cdp-selector-geometry",
]
chromium-dom-content = [
    "cdp",
    "dom-content",
    "dep:pwright-composition-chromium-dom-content",
]
chromium-evaluation = [
    "cdp",
    "evaluation",
    "dep:pwright-composition-chromium-evaluation",
]
chromium-navigation = [
    "cdp",
    "navigation",
    "dep:pwright-composition-chromium-navigation",
]
chromium-page-events = [
    "cdp",
    "page-events",
    "transport",
    "dep:pwright-composition-chromium-page-events",
]
chromium-network-events = [
    "cdp",
    "network-events",
    "runtime",
    "transport",
    "dep:pwright-composition-chromium-network-events",
]
runtime = ["core", "dep:pwright-runtime"]
runtime-tokio = ["runtime", "dep:pwright-runtime-tokio"]
transport = ["core", "dep:pwright-transport"]
transport-tokio = ["transport", "dep:pwright-transport-tokio"]
tokio = ["runtime-tokio", "transport-tokio"]

