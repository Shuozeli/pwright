[package]
name = "pwright-backend-cdp-drag"
description = "Optional caller-owned Chromium drag observation and cleanup primitives"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
mouse-dispatch = ["dep:pwright-backend-cdp-input"]

[dependencies]
pwright-backend-cdp-input = { workspace = true, optional = true }
pwright-cdp = { workspace = true }
pwright-core = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
pwright-fake = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time", "sync"] }
url = { workspace = true }
