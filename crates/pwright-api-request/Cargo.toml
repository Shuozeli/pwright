[package]
name = "pwright-api-request"
description = "Browser-independent, bounded API request capability for Pwright language bindings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []

[dependencies]
async-trait.workspace = true
mime_guess.workspace = true
thiserror.workspace = true
tokio = { version = "1", default-features = false, features = ["macros", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
url.workspace = true

[dev-dependencies]
tokio.workspace = true
