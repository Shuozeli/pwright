[package]
name = "pwright-backend-cdp-locator"
description = "Complete Chromium CDP Locator capability backend for Pwright"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
touchscreen-input = ["dep:pwright-cap-touchscreen"]
retained-element-click = []
fill-navigation-commit = ["pwright-cdp/fill-navigation-commit"]
select-option-navigation-commit = ["pwright-cdp/runtime-binding"]
select-option-timeout-progress = ["pwright-cap-locator/select-option-timeout-progress"]

[dependencies]
pwright-backend-cdp-common = { workspace = true }
pwright-backend-cdp-input = { workspace = true }
pwright-backend-cdp-selector-runtime = { workspace = true }
pwright-cap-locator = { workspace = true }
pwright-cap-touchscreen = { workspace = true, optional = true }
pwright-cdp = { workspace = true }
pwright-core = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
pwright-browser-model = { workspace = true }
pwright-fake = { workspace = true }
pwright-runtime = { workspace = true }
pwright-runtime-tokio = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
