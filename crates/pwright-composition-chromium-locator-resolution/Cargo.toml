[package]
name = "pwright-composition-chromium-locator-resolution"
description = "Caller-owned cancellation-safe Chromium Locator resolution"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
retained-reference = ["pwright-backend-cdp-locator-resolution/retained-reference"]

[dependencies]
pwright-backend-cdp-locator-resolution = { workspace = true }
pwright-backend-cdp-selector-runtime = { workspace = true }
pwright-cdp = { workspace = true }
pwright-core = { workspace = true }
pwright-runtime = { workspace = true }
pwright-selector-model = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
pwright-browser-provider = { workspace = true }
pwright-fake = { workspace = true }
pwright-provider-cdp = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
