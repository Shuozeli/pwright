format: 1
capability: pwright.page_creation
version: { major: 1, minor: 0 }
root: pwright.page_creation
imports:
  - pwright.common
dependencies:
  - id: pwright.page_lifecycle
    minimum_version: { major: 1, minor: 0 }
commands:
  - id: browser-context.new_page
    name: browser_context_new_page
    method: 196613
    targets: [pwright.browser.browser_context]
    command: browser_context_new_page_command
    result: browser_context_new_page_result
    params_type: pwright.page_creation.browser_context_new_page_options
    result_type: pwright.page_creation.page_initializer
    error_details_type: pwright.page_creation.error_details
types:
  - kind: tagged_union
    id: pwright.page_creation
    variants:
      - tag: 1
        name: browser_context_new_page_command
        fields:
          - { name: call_id, type: u64 }
          - { name: object_id, type: u64 }
          - { name: metadata, type: message, target: pwright.common.call_metadata }
          - { name: options, type: message, target: pwright.page_creation.browser_context_new_page_options }
      - tag: 2
        name: browser_context_new_page_result
        fields:
          - { name: call_id, type: u64 }
          - { name: outcome, type: message, target: pwright.page_creation.outcome }

  - kind: record
    id: pwright.page_creation.browser_context_new_page_options
    public_name: browser_context_new_page_options
    public_external: true
    fields: []

  - kind: record
    id: pwright.page_creation.error
    fields:
      - { name: failure_kind, type: enum, target: pwright.common.failure_kind }
      - { name: message, type: utf8 }
      - name: details
        type: message
        target: pwright.page_creation.error_details
        cardinality: optional

  - kind: tagged_union
    id: pwright.page_creation.error_details
    public_name: page_creation_error_details
    variants:
      - tag: 0
        name: invalid_backend_response
        fields:
          - { name: message, type: utf8 }
      - tag: 1
        name: publication
        fields:
          - { name: message, type: utf8 }
      - tag: 2
        name: cleanup
        fields:
          - { name: primary, type: utf8 }
          - { name: cleanup, type: utf8 }
      - tag: 3
        name: backend
        fields:
          - { name: message, type: utf8 }

  - kind: tagged_union
    id: pwright.page_creation.outcome
    variants:
      - tag: 0
        name: success
        fields:
          - { name: result, type: message, target: pwright.page_creation.page_initializer }
      - tag: 1
        name: error
        fields:
          - { name: error, type: message, target: pwright.page_creation.error }

  - kind: record
    id: pwright.page_creation.page_initializer
    public_name: page_initializer
    public_external: true
    fields:
      - { name: object_id, type: u64 }
      - { name: parent_id, type: u64 }
      - { name: object_kind, type: u32 }
      - { name: main_frame_id, type: u64 }
      - { name: main_frame_parent_id, type: u64 }
      - { name: main_frame_kind, type: u32 }
