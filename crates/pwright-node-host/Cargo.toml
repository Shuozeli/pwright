[package]
name = "pwright-node-host"
description = "Safe embedded Rust v2 host for the Pwright Node compatibility package"
version.workspace = true
edition.workspace = true
license = "MIT AND Apache-2.0"
repository.workspace = true

[features]
default = []
cdp-handshake-headers = ["pwright-composition-chromium/cdp-handshake-headers"]
cdp-default-user-agent = ["cdp-handshake-headers", "dep:pwright-playwright-connect-headers"]
cdp-discovery-errors = []
cdp-ws-close-reason = ["pwright-cdp/cdp-ws-close-reason"]
cdp-ws-invalid-frame = ["pwright-cdp/cdp-ws-invalid-frame"]
cdp-session = []
browser-cdp-session = ["cdp-session"]
owned-launch = ["dep:pwright-browser-provider", "dep:pwright-composition-chromium-launch", "dep:pwright-provider-chromium", "pwright-composition-chromium-launch/startup-logs"]
playwright-trace = ["owned-launch", "dep:pwright-trace-playwright-v8"]
persistent-context-locale = ["owned-launch", "context-locale"]
persistent-context-timezone = ["owned-launch", "context-timezone"]
persistent-context-offline = ["owned-launch", "context-offline"]
persistent-context-geolocation = ["owned-launch", "context-geolocation"]
persistent-context-geolocation-permission = ["owned-launch", "context-geolocation-permission"]
persistent-context-http-credentials = ["owned-launch", "context-http-credentials"]
persistent-context-launch-arguments = ["owned-launch"]
persistent-context-ignore-https-errors = ["owned-launch", "ignore-https-errors"]
persistent-context-device-emulation = ["owned-launch", "device-emulation"]
persistent-context-emulate-media = ["owned-launch", "emulate-media"]
persistent-context-extra-headers = ["owned-launch", "extra-headers"]
persistent-context-bypass-csp = ["owned-launch", "bypass-csp"]
persistent-context-javascript-disabled = ["owned-launch", "javascript-disabled"]
context-cookies = ["dep:regex"]
context-storage-state = ["context-cookies", "page-routes"]
context-api-request = ["context-cookies", "device-emulation", "context-http-credentials", "ignore-https-errors"]
retained-target-marking = ["retained-file-input", "pwright-composition-chromium-file-input/retained-target-marking"]
retained-target-prevalidation = ["retained-target-marking", "pwright-composition-chromium-file-input/retained-target-prevalidation"]
retained-serialized-payload-import = ["retained-target-prevalidation"]
retained-serialized-payload-mutation = ["retained-serialized-payload-import", "pwright-composition-chromium-file-input/retained-serialized-payload-mutation"]
retained-file-input = ["handles", "file-input", "pwright-composition-chromium-handle-evaluation/retained-reference", "pwright-composition-chromium-locator-resolution/retained-reference"]
handles = ["dep:pwright-cap-handle-lifecycle", "dep:pwright-codec-handle-evaluation", "dep:pwright-codec-handle-lifecycle", "dep:pwright-composition-chromium-handle-evaluation", "pwright-composition-chromium-handle-evaluation/native-creation", "pwright-composition-chromium-handle-evaluation/frame-value", "pwright-composition-chromium-handle-evaluation/handle-value", "dep:pwright-composition-chromium-handle-lifecycle", "pwright-composition-chromium-handle-lifecycle/native-release", "pwright-runtime/disposal-reservations"]
frame-element = ["handles"]
element-handle-dom = ["handles", "locator-bounding-box"]
element-handle-select-option-value = ["handles", "timeout-settings"]
element-handle-wait-for-selector = ["handles", "timeout-settings"]
element-handle-scroll-into-view = ["handles", "pwright-composition-chromium-handle-evaluation/retained-reference"]
element-handle-select-text = ["handles"]
element-handle-state-predicates = ["element-handle-dom"]
element-handle-state-wait = ["element-handle-dom"]
element-handle-click = ["element-handle-dom", "pwright-backend-cdp-locator/retained-element-click", "pwright-composition-chromium-handle-evaluation/retained-reference"]
fill-navigation-commit = ["pwright-composition-chromium/fill-navigation-commit"]
select-option-navigation-commit = ["pwright-composition-chromium/select-option-navigation-commit"]
select-option-timeout-progress = ["pwright-composition-chromium/select-option-timeout-progress"]
file-input = ["dep:pwright-file-input-model", "dep:pwright-file-input-source", "dep:pwright-file-input-fs", "dep:pwright-file-input-tokio", "dep:pwright-backend-cdp-file-input", "dep:pwright-composition-chromium-file-input", "pwright-backend-cdp-file-input/large-commands"]
file-input-native-paths = ["file-input", "pwright-composition-chromium-file-input/retained-preflight"]
concurrent-close = ["pwright-composition-chromium/native-close-retirement", "pwright-runtime/disposal-reservations", "pwright-backend-cdp-topology/transition-reservations"]
extra-headers = ["dep:pwright-network-model", "pwright-network-model/extra-headers", "dep:futures-util"]
frame-lifecycle = ["dep:pwright-plugin-chromium-frame-lifecycle", "pwright-composition-chromium/frame-lifecycle"]
page-events = ["frame-lifecycle"]
frame-events = ["page-events"]
frame-detach-events = ["page-events", "pwright-backend-cdp-topology/frame-detach-events"]
page-dialogs = ["page-events"]
file-chooser-events = ["page-events", "file-input"]
file-chooser-native-paths = ["file-chooser-events"]
page-errors = ["page-events"]
page-routes = ["frame-lifecycle", "dep:base64"]
route-request-history = ["page-routes", "request-history"]
route-regexp = ["page-routes", "dep:regex"]
route-redirects = ["page-routes", "request-history"]
route-fulfill-cors = ["page-routes"]
route-fulfill-path = ["page-routes", "dep:mime_guess"]
har-replay = ["page-routes", "dep:pwright-har-replay"]
console-events = ["frame-lifecycle"]
console-argument-handles = ["console-events", "handles"]
console-history = ["frame-lifecycle"]
page-bindings = ["frame-lifecycle", "handles"]
context-bindings = ["page-bindings"]
init-scripts = []
service-worker-policy = ["init-scripts"]
wait-for-function = ["handles"]
wait-for-timeout = []
frame-navigation = ["frame-lifecycle", "pwright-cap-navigation/frame-navigation"]
navigation-url-match = ["frame-navigation", "url-glob"]
frame-navigation-burst-20 = ["frame-navigation"]
history-navigation = [
    "dep:pwright-cap-history-navigation",
    "pwright-backend-cdp/history-navigation",
    "pwright-composition-chromium/history-navigation",
]
url-glob = []
url-wait = ["url-glob", "frame-lifecycle"]
set-content = ["frame-lifecycle"]
selector-registration = []
light-selectors = ["handles"]
layout-selectors = []
react-selectors = ["handles"]
emulate-media = []
context-forced-colors = ["emulate-media"]
device-emulation = []
touchscreen-input = [
    "device-emulation",
    "dep:pwright-backend-cdp-input",
    "dep:pwright-backend-cdp-touchscreen",
    "dep:pwright-cap-touchscreen",
    "dep:pwright-composition-chromium-touchscreen",
    "pwright-backend-cdp-locator/touchscreen-input",
    "pwright-composition-chromium/touchscreen-input",
]
context-locale = []
context-timezone = []
context-offline = []
context-geolocation = []
context-geolocation-permission = []
context-http-credentials = ["frame-lifecycle"]
context-proxy = ["dep:zeroize"]
ignore-https-errors = []
bypass-csp = []
javascript-disabled = []
page-pdf = ["dep:base64"]
page-viewport = ["device-emulation"]
request-gc = []
response-body = ["frame-navigation", "dep:base64"]
response-request = ["frame-navigation", "request-history"]
locator-bounding-box = []
locator-highlight = ["locator-bounding-box"]
locator-screenshot = ["dep:pwright-cap-locator-screenshot", "dep:pwright-codec-locator-screenshot"]
locator-dom-actions = []
timeout-settings = []
page-pause = ["timeout-settings"]
large-evaluation-results = []
large-evaluation-inputs = []
large-route-post-data = ["page-routes"]
network-events = ["dep:pwright-backend-cdp", "dep:pwright-cap-network-events", "dep:pwright-network-model", "dep:pwright-runtime-control"]
context-network-events = ["network-events"]
request-frame = [
    "network-events",
    "pwright-backend-cdp/request-frame",
    "pwright-composition-chromium/request-frame",
]
request-timing = [
    "network-events",
    "pwright-backend-cdp/request-timing",
    "pwright-cap-network-events/request-timing",
    "pwright-composition-chromium/request-timing",
    "pwright-network-model/request-timing",
]
request-post-data-json = ["network-events"]
request-history = ["network-events"]
request-events = ["network-events"]
response-events = ["network-events"]
response-finished = ["response-events"]
navigation-response-finished = ["response-request", "response-finished"]
response-security-details = [
    "response-request",
    "pwright-backend-cdp/response-security-details",
    "pwright-composition-chromium/response-security-details",
]
download-events = ["frame-lifecycle"]
worker-events = ["page-events"]
worker-handle-evaluation = ["worker-events", "dep:pwright-backend-cdp-handle-evaluation"]
worker-console-events = ["worker-events", "console-events"]
worker-console-argument-handles = ["worker-console-events", "worker-handle-evaluation"]
worker-error-events = ["worker-events", "page-errors"]
worker-network-events = ["worker-events", "request-events", "response-events"]
drag-source = ["dep:pwright-backend-cdp-drag"]
drag-runtime = ["drag-source", "pwright-runtime/lifetime-handoff"]
drag-and-drop = ["drag-runtime", "locator-bounding-box"]

[dependencies]
pwright-playwright-connect-headers = { workspace = true, optional = true }
pwright-browser-provider = { workspace = true, optional = true }
pwright-trace-playwright-v8 = { workspace = true, optional = true }
pwright-cap-handle-lifecycle = { workspace = true, optional = true }
pwright-backend-cdp = { workspace = true, optional = true }
pwright-cap-network-events = { workspace = true, optional = true }
pwright-network-model = { workspace = true, optional = true }
pwright-har-replay = { workspace = true, optional = true }
pwright-runtime-control = { workspace = true, optional = true }
pwright-codec-handle-evaluation = { workspace = true, optional = true }
pwright-codec-handle-lifecycle = { workspace = true, optional = true }
pwright-composition-chromium-handle-evaluation = { workspace = true, optional = true }
pwright-composition-chromium-handle-lifecycle = { workspace = true, optional = true }
pwright-file-input-model = { workspace = true, optional = true }
pwright-file-input-source = { workspace = true, optional = true }
pwright-file-input-fs = { workspace = true, optional = true }
pwright-file-input-tokio = { workspace = true, optional = true }
pwright-backend-cdp-file-input = { workspace = true, optional = true }
pwright-composition-chromium-file-input = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }
pwright-input-model = { workspace = true }
pwright-backend-cdp-drag = { workspace = true, optional = true, features = ["mouse-dispatch"] }
pwright-cap-mouse = { workspace = true }
pwright-backend-cdp-mouse = { workspace = true }
pwright-composition-chromium-mouse = { workspace = true, features = ["runtime"] }
pwright-backend-cdp-touchscreen = { workspace = true, optional = true }
pwright-backend-cdp-input = { workspace = true, optional = true }
pwright-cap-touchscreen = { workspace = true, optional = true }
pwright-composition-chromium-touchscreen = { workspace = true, optional = true }
pwright-cap-keyboard = { workspace = true }
pwright-composition-chromium-keyboard = { workspace = true, features = ["runtime"] }
pwright-backend-cdp-content = { workspace = true }
pwright-cap-content = { workspace = true }
pwright-codec-content = { workspace = true }
pwright-backend-cdp-context-creation = { workspace = true }
pwright-cap-context-creation = { workspace = true }
pwright-cap-context-lifecycle = { workspace = true }
pwright-codec-context-creation = { workspace = true }
pwright-codec-context-lifecycle = { workspace = true }
pwright-backend-cdp-navigation = { workspace = true }
pwright-backend-cdp-dom-content = { workspace = true }
pwright-backend-cdp-evaluation = { workspace = true }
pwright-backend-cdp-handle-evaluation = { workspace = true, optional = true }
pwright-backend-cdp-page-creation = { workspace = true }
pwright-backend-cdp-page-lifecycle = { workspace = true, features = ["native-confirmation"] }
pwright-backend-cdp-topology = { workspace = true }
pwright-cap-navigation = { workspace = true }
pwright-cap-history-navigation = { workspace = true, optional = true }
pwright-cap-dom-content = { workspace = true }
pwright-cap-evaluation = { workspace = true }
pwright-cap-locator = { workspace = true }
pwright-cap-locator-screenshot = { workspace = true, optional = true }
pwright-backend-cdp-selector-runtime = { workspace = true }
pwright-backend-cdp-locator = { workspace = true }
pwright-codec-locator = { workspace = true }
pwright-codec-locator-screenshot = { workspace = true, optional = true }
pwright-cap-page-creation = { workspace = true }
pwright-cap-page-lifecycle = { workspace = true }
pwright-cdp = { workspace = true }
pwright-codec-navigation = { workspace = true }
pwright-codec-dom-content = { workspace = true }
pwright-codec-evaluation = { workspace = true }
pwright-codec-page-creation = { workspace = true }
pwright-codec-page-lifecycle = { workspace = true }
pwright-composition-chromium = { workspace = true }
pwright-composition-chromium-launch = { workspace = true, optional = true }
pwright-composition-chromium-locator-evaluation = { workspace = true }
pwright-composition-chromium-locator-resolution = { workspace = true }
pwright-cap-handle-evaluation = { workspace = true }
pwright-browser-model = { workspace = true }
pwright-core = { workspace = true }
pwright-provider-cdp = { workspace = true }
pwright-provider-chromium = { workspace = true, optional = true }
pwright-plugin-chromium-session-initialization = { workspace = true }
pwright-plugin-chromium-frame-observer = { workspace = true }
pwright-plugin-chromium-frame-lifecycle = { workspace = true, optional = true }
pwright-runtime = { workspace = true }
pwright-runtime-tokio = { workspace = true }
pwright-server-wire = { workspace = true }
pwright-transport = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
regex = { version = "1", optional = true }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
futures-util = { workspace = true }
pwright-fake = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = { workspace = true }
tracing-subscriber = { workspace = true }
