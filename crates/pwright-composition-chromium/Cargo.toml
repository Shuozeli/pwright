pwright-client = { workspace = true }
pwright-client-context-lifecycle = { workspace = true }
pwright-client-content = { workspace = true }
pwright-client-dom-content = { workspace = true }
pwright-client-context-creation = { workspace = true }
pwright-client-evaluation = { workspace = true }
pwright-client-events = { workspace = true }
pwright-client-handle-evaluation = { workspace = true }
pwright-client-page-lifecycle = { workspace = true }
pwright-client-page-creation = { workspace = true }
pwright-client-control = { workspace = true }
pwright-client-navigation = { workspace = true }
pwright-client-network-events = { workspace = true }
pwright-client-wire = { workspace = true }
pwright-fake = { workspace = true }
pwright-process-metrics = { workspace = true, features = ["ledger"] }
pwright-transport-memory = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
