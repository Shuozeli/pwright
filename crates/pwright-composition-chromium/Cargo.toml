[package]
name = "pwright-composition-chromium"
description = "Explicit production composition root for attaching Pwright to Chromium over CDP"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
cdp-handshake-headers = ["pwright-provider-cdp/cdp-handshake-headers"]
close-route-retirement = []
native-close-retirement = ["close-capacity", "close-route-retirement", "native-close-scheduler"]
close-capacity = ["dep:pwright-backend-cdp-topology", "pwright-backend-cdp-topology/transition-reservations", "pwright-runtime/disposal-reservations"]
native-close-authority = ["pwright-backend-cdp-page-lifecycle/native-confirmation", "dep:pwright-backend-cdp-common"]
native-close-scheduler = ["native-close-authority"]
frame-lifecycle = ["dep:pwright-plugin-chromium-frame-lifecycle"]
history-navigation = [
    "dep:pwright-cap-history-navigation",
    "pwright-backend-cdp/history-navigation",
]
request-frame = ["pwright-backend-cdp/request-frame"]
response-security-details = [
    "pwright-backend-cdp/response-security-details",
    "pwright-composition-chromium-network-events/response-security-details",
]
request-timing = [
    "pwright-backend-cdp/request-timing",
    "pwright-cap-network-events/request-timing",
    "pwright-codec-network-events/request-timing",
    "pwright-composition-chromium-network-events/request-timing",
    "pwright-network-model/request-timing",
]
touchscreen-input = ["dep:pwright-cap-touchscreen", "pwright-backend-cdp/touchscreen-input"]
fill-navigation-commit = ["pwright-backend-cdp/fill-navigation-commit"]
select-option-navigation-commit = ["pwright-backend-cdp/select-option-navigation-commit"]
select-option-timeout-progress = ["pwright-backend-cdp/select-option-timeout-progress"]

[dependencies]
pwright-backend-cdp-topology = { workspace = true, optional = true }
pwright-backend-cdp-common = { workspace = true, optional = true }
pwright-backend-cdp-input = { workspace = true }
pwright-backend-cdp = { workspace = true }
pwright-backend-cdp-page-lifecycle = { workspace = true }
pwright-browser-backend = { workspace = true }
pwright-browser-model = { workspace = true }
pwright-browser-provider = { workspace = true }
pwright-cap-browser-events = { workspace = true }
pwright-cap-context-lifecycle = { workspace = true }
pwright-cap-content = { workspace = true }
pwright-cap-dom-content = { workspace = true }
pwright-cap-context-creation = { workspace = true }
pwright-cap-evaluation = { workspace = true }
pwright-cap-handle-evaluation = { workspace = true }
pwright-cap-handle-lifecycle = { workspace = true }
pwright-cap-locator = { workspace = true }
pwright-cap-locator-screenshot = { workspace = true }
pwright-cap-navigation = { workspace = true }
pwright-cap-history-navigation = { workspace = true, optional = true }
pwright-cap-network-events = { workspace = true }
pwright-cap-page-events = { workspace = true }
pwright-cap-page-creation = { workspace = true }
pwright-cap-touchscreen = { workspace = true, optional = true }
pwright-cap-page-lifecycle = { workspace = true }
pwright-cdp = { workspace = true }
pwright-codec-locator = { workspace = true }
pwright-codec-locator-screenshot = { workspace = true }
pwright-codec-content = { workspace = true }
pwright-codec-dom-content = { workspace = true }
pwright-codec-context-lifecycle = { workspace = true }
pwright-codec-context-creation = { workspace = true }
pwright-codec-page-lifecycle = { workspace = true }
pwright-codec-page-creation = { workspace = true }
pwright-codec-page-events = { workspace = true }
pwright-codec-handshake = { workspace = true }
pwright-codec-control = { workspace = true }
pwright-codec-browser-events = { workspace = true }
pwright-codec-evaluation = { workspace = true }
pwright-codec-handle-evaluation = { workspace = true }
pwright-codec-handle-lifecycle = { workspace = true }
pwright-codec-navigation = { workspace = true }
pwright-codec-network-events = { workspace = true }
pwright-composition-chromium-handle-evaluation = { workspace = true }
pwright-composition-chromium-network-events = { workspace = true }
pwright-composition-chromium-page-events = { workspace = true }
pwright-core = { workspace = true }
pwright-network-model = { workspace = true }
pwright-provider-cdp = { workspace = true }
pwright-plugin-ordered-handle-delivery = { workspace = true }
pwright-plugin-chromium-frame-observer = { workspace = true }
pwright-plugin-chromium-frame-lifecycle = { workspace = true, optional = true }
pwright-plugin-chromium-session-initialization = { workspace = true }
pwright-runtime = { workspace = true }
pwright-runtime-control = { workspace = true }
pwright-server-locator = { workspace = true }
pwright-server-locator-screenshot = { workspace = true }
pwright-server-content = { workspace = true }
pwright-server-dom-content = { workspace = true }
pwright-server-context-lifecycle = { workspace = true }
pwright-server-context-creation = { workspace = true }
pwright-server-evaluation = { workspace = true }
pwright-server-handle-evaluation = { workspace = true }
pwright-server-handle-lifecycle = { workspace = true }
pwright-server-page-lifecycle = { workspace = true }
