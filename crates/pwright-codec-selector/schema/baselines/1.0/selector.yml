format: 1
library: pwright.selector
version: { major: 1, minor: 0 }
types:
  - kind: enum
    id: pwright.locator.optional_aria_tri_state
    variants:
      - { tag: 0, name: absent }
      - { tag: 1, name: "false" }
      - { tag: 2, name: "true" }
      - { tag: 3, name: mixed }

  - kind: enum
    id: pwright.locator.optional_bool
    variants:
      - { tag: 0, name: absent }
      - { tag: 1, name: "false" }
      - { tag: 2, name: "true" }
  - kind: record
    id: pwright.locator.regex_matcher
    fields:
      - { name: source, type: utf8 }
      - { name: flags, type: utf8 }

  - kind: record
    id: pwright.locator.role_pattern_selector
    fields:
      - { name: role, type: utf8 }
      - { name: name, type: message, target: pwright.locator.text_pattern, cardinality: optional }
      - { name: description, type: message, target: pwright.locator.text_pattern, cardinality: optional }
      - { name: checked, type: enum, target: pwright.locator.optional_aria_tri_state }
      - { name: disabled, type: enum, target: pwright.locator.optional_bool }
      - { name: expanded, type: enum, target: pwright.locator.optional_bool }
      - { name: include_hidden, type: bool }
      - { name: level, type: u32, cardinality: optional, constraints: { minimum: 1 } }
      - { name: pressed, type: enum, target: pwright.locator.optional_aria_tri_state }
      - { name: selected, type: enum, target: pwright.locator.optional_bool }

  - kind: record
    id: pwright.locator.role_selector
    fields:
      - { name: role, type: utf8 }
      - { name: name, type: message, target: pwright.locator.text_matcher, cardinality: optional }
      - { name: description, type: message, target: pwright.locator.text_matcher, cardinality: optional }
      - { name: checked, type: enum, target: pwright.locator.optional_aria_tri_state }
      - { name: disabled, type: enum, target: pwright.locator.optional_bool }
      - { name: expanded, type: enum, target: pwright.locator.optional_bool }
      - { name: include_hidden, type: bool }
      - { name: level, type: u32, cardinality: optional, constraints: { minimum: 1 } }
      - { name: pressed, type: enum, target: pwright.locator.optional_aria_tri_state }
      - { name: selected, type: enum, target: pwright.locator.optional_bool }

  - kind: tagged_union
    id: pwright.locator.selector
    variants:
      - tag: 0
        name: css
        fields:
          - { name: value, type: utf8 }
      - tag: 1
        name: nth
        fields:
          - { name: base, type: message, target: pwright.locator.selector }
          - { name: index, type: i32 }
      - tag: 2
        name: filter_text
        fields:
          - { name: base, type: message, target: pwright.locator.selector }
          - { name: text, type: utf8 }
          - { name: exact, type: bool }
      - tag: 3
        name: and
        fields:
          - { name: left, type: message, target: pwright.locator.selector }
          - { name: right, type: message, target: pwright.locator.selector }
      - tag: 4
        name: or
        fields:
          - { name: left, type: message, target: pwright.locator.selector }
          - { name: right, type: message, target: pwright.locator.selector }
      - tag: 5
        name: text
        fields:
          - { name: matcher, type: message, target: pwright.locator.text_matcher }
      - tag: 6
        name: label
        fields:
          - { name: matcher, type: message, target: pwright.locator.text_matcher }
      - tag: 7
        name: role
        fields:
          - { name: selector, type: message, target: pwright.locator.role_selector }
      - tag: 8
        name: within
        fields:
          - { name: base, type: message, target: pwright.locator.selector }
          - { name: descendant, type: message, target: pwright.locator.selector }
      - tag: 9
        name: filter_not_text
        fields:
          - { name: base, type: message, target: pwright.locator.selector }
          - { name: text, type: utf8 }
          - { name: exact, type: bool }
      - tag: 10
        name: filter_has
        fields:
          - { name: base, type: message, target: pwright.locator.selector }
          - { name: descendant, type: message, target: pwright.locator.selector }
      - tag: 11
        name: filter_has_not
        fields:
          - { name: base, type: message, target: pwright.locator.selector }
          - { name: descendant, type: message, target: pwright.locator.selector }
      - tag: 12
        name: filter_visible
        fields:
          - { name: base, type: message, target: pwright.locator.selector }
          - { name: visible, type: bool }
      - tag: 13
        name: text_regex
        fields:
          - { name: matcher, type: message, target: pwright.locator.regex_matcher }
      - tag: 14
        name: label_regex
        fields:
          - { name: matcher, type: message, target: pwright.locator.regex_matcher }
      - tag: 15
        name: filter_text_regex
        fields:
          - { name: base, type: message, target: pwright.locator.selector }
          - { name: matcher, type: message, target: pwright.locator.regex_matcher }
      - tag: 16
        name: filter_not_text_regex
        fields:
          - { name: base, type: message, target: pwright.locator.selector }
          - { name: matcher, type: message, target: pwright.locator.regex_matcher }
      - tag: 17
        name: role_pattern
        fields:
          - { name: selector, type: message, target: pwright.locator.role_pattern_selector }
      - tag: 18
        name: attribute_text
        fields:
          - { name: attribute, type: enum, target: pwright.locator.user_facing_attribute }
          - { name: matcher, type: message, target: pwright.locator.text_matcher }
      - tag: 19
        name: attribute_regex
        fields:
          - { name: attribute, type: enum, target: pwright.locator.user_facing_attribute }
          - { name: matcher, type: message, target: pwright.locator.regex_matcher }
      - tag: 20
        name: test_id_text
        fields:
          - { name: attributes, type: utf8 }
          - { name: value, type: utf8 }
      - tag: 21
        name: test_id_regex
        fields:
          - { name: attributes, type: utf8 }
          - { name: matcher, type: message, target: pwright.locator.regex_matcher }
  - kind: record
    id: pwright.locator.text_matcher
    fields:
      - { name: value, type: utf8 }
      - { name: exact, type: bool }

  - kind: tagged_union
    id: pwright.locator.text_pattern
    variants:
      - tag: 0
        name: string
        fields:
          - { name: matcher, type: message, target: pwright.locator.text_matcher }
      - tag: 1
        name: regex
        fields:
          - { name: matcher, type: message, target: pwright.locator.regex_matcher }

  - kind: enum
    id: pwright.locator.user_facing_attribute
    variants:
      - { tag: 0, name: placeholder }
      - { tag: 1, name: alt }
      - { tag: 2, name: title }
