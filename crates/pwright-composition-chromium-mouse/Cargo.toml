[package]
name = "pwright-composition-chromium-mouse"
description = "Optional Mouse Page route with bounded caller-polled native retirement"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
runtime = ["dep:pwright-runtime"]

[dependencies]
pwright-runtime = { workspace = true, optional = true }
pwright-backend-cdp-mouse = { workspace = true }
pwright-backend-cdp-input = { workspace = true }
pwright-cap-mouse = { workspace = true }
pwright-cdp = { workspace = true }
pwright-codec-mouse = { workspace = true }
pwright-core = { workspace = true }
pwright-server-mouse = { workspace = true }
pwright-transport = { workspace = true }

[dev-dependencies]
pwright-input-model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
pwright-browser-model = { workspace = true }
pwright-fake = { workspace = true }
pwright-server-wire = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
