<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pwright v2 Design Review</title>
    <style>
      :root { color-scheme: light; --ink:#172033; --muted:#667085; --line:#d8dee9; --paper:#fff; --bg:#f5f7fa; --accent:#215ea8; }
      * { box-sizing: border-box; }
      body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.68 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
      header { position:sticky; top:0; z-index:2; background:rgba(255,255,255,.94); border-bottom:1px solid var(--line); backdrop-filter:blur(12px); }
      .bar, main { width:min(980px,calc(100% - 32px)); margin:auto; }
      .bar { min-height:60px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
      .brand { font-weight:800; }
      .status { color:#8a5312; background:#fff2d8; border-radius:999px; padding:5px 10px; font-size:12px; font-weight:700; }
      nav { display:flex; gap:8px; flex-wrap:wrap; }
      nav a { padding:6px 10px; border:1px solid var(--line); border-radius:8px; text-decoration:none; background:#fff; font-size:13px; }
      main { margin-top:28px; margin-bottom:60px; padding:42px 52px; background:var(--paper); border:1px solid var(--line); border-radius:14px; box-shadow:0 14px 40px rgba(23,32,51,.06); }
      h1,h2,h3 { line-height:1.22; letter-spacing:-.02em; scroll-margin-top:80px; }
      h1 { font-size:42px; margin-top:0; }
      h2 { margin-top:42px; padding-top:10px; border-top:1px solid var(--line); }
      h3 { margin-top:30px; }
      p,li { color:#344054; }
      a { color:var(--accent); }
      blockquote { margin:20px 0; padding:10px 18px; border-left:4px solid #e3a530; background:#fff8e7; }
      pre { overflow:auto; padding:18px; border-radius:10px; background:#121a2a; color:#e7edf7; font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; }
      code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
      :not(pre)>code { padding:2px 5px; border-radius:5px; background:#edf2f7; color:#1f3c64; }
      .error { color:#a33; }
      @media (max-width:680px) { main { padding:26px 20px; } h1 { font-size:32px; } }
    </style>
  </head>
  <body>
    <header><div class="bar"><div class="brand">Pwright v2 Design Review</div><nav><a href="#tasks">Design tasks</a><a href="#course">Playwright course</a><a href="#architecture">Architecture candidate</a></nav><div class="status">Discussion draft</div></div></header>
    <main id="document" aria-live="polite">Loading canonical Markdown…</main>
    <script>
      const escapeHtml = (value) => value.replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
      const inline = (value) => escapeHtml(value)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      function render(markdown) {
        const lines = markdown.split("\n"); let html = "", inCode = false, code = [], inList = false;
        const closeList = () => { if (inList) { html += "</ul>"; inList = false; } };
        for (const line of lines) {
          if (line.startsWith("```")) { closeList(); if (inCode) { html += `<pre><code>${escapeHtml(code.join("\n"))}</code></pre>`; code=[]; } inCode=!inCode; continue; }
          if (inCode) { code.push(line); continue; }
          const heading = line.match(/^(#{1,3})\s+(.+)$/);
          if (heading) { closeList(); const level=heading[1].length; html += `<h${level}>${inline(heading[2])}</h${level}>`; continue; }
          if (line.startsWith("- ")) { if (!inList) { html += "<ul>"; inList=true; } html += `<li>${inline(line.slice(2))}</li>`; continue; }
          closeList();
          if (line.startsWith("> ")) { html += `<blockquote>${inline(line.slice(2))}</blockquote>`; }
          else if (line.trim()) { html += `<p>${inline(line)}</p>`; }
        }
        closeList(); return html;
      }
      const documents = { tasks: "design-tasks-v2.md", course: "knowledge/playwright-design-course.md", architecture: "architecture-v2.md" };
      const load = () => {
        const selected = location.hash.slice(1) || "tasks";
        const documentPath = documents[selected] || documents.tasks;
        document.getElementById("document").innerHTML = "Loading canonical Markdown…";
        fetch(documentPath)
        .then((response) => { if (!response.ok) throw new Error(`HTTP ${response.status}`); return response.text(); })
        .then((markdown) => { document.getElementById("document").innerHTML = render(markdown); })
        .catch((error) => { document.getElementById("document").innerHTML = `<p class="error">Unable to load the canonical Markdown: ${escapeHtml(error.message)}</p>`; });
      };
      addEventListener("hashchange", load);
      load();
    </script>
  </body>
</html>
